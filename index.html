<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Уютный остров</title>
  <style>
    :root {
      --joystick-size: min(24vmin, 140px);
      --joy-stick-size: calc(var(--joystick-size) * 0.45);
      --btn-main: clamp(68px, 16vmin, 100px);
      --btn-sub: clamp(54px, 12vmin, 75px);
      --btn-gap: max(10px, 2vmin);
      --control-gap: calc(10vh + env(safe-area-inset-bottom));
      --control-gap-side: max(7vw, env(safe-area-inset-right), env(safe-area-inset-left));
      --font-main: clamp(11px, calc(var(--btn-main) * 0.16), 16px);
      --font-sub: clamp(8px, calc(var(--btn-main) * 0.095), 10px);
    }

    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      -webkit-user-select: none; 
      user-select: none; 
      -webkit-tap-highlight-color: transparent; 
    }

    html, body { 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background: #000; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; 
    }
    
    #game-wrapper { 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100vw; 
      height: 100vh; 
      height: 100dvh; 
      background: #000; 
      overflow: hidden; 
    }

    #game-container { 
      position: absolute; 
      inset: 0; 
      width: 100%; 
      height: 100%; 
    }

    canvas { 
      display: block; 
      position: absolute; 
      inset: 0; 
      width: 100%; 
      height: 100%; 
      touch-action: none; 
    }

    #ui { 
      position: fixed; 
      inset: 0; 
      pointer-events: none; 
      z-index: 10; 
      color: #fff; 
    }

    #res-group { 
      position: absolute; 
      top: max(14px, env(safe-area-inset-top)); 
      left: max(14px, env(safe-area-inset-left)); 
      display: flex; 
      gap: 8px; 
      flex-wrap: wrap; 
      max-width: calc(100% - 88px); 
    }

    .res { 
      background: rgba(30, 22, 16, 0.55); 
      backdrop-filter: blur(10px); 
      -webkit-backdrop-filter: blur(10px); 
      padding: 7px 14px 7px 8px; 
      border-radius: 999px; 
      font-size: 14px; 
      font-weight: 700; 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      border: 1px solid rgba(255, 255, 255, 0.12); 
      color: #fff; 
    }

    .res svg { 
      width: 22px; 
      height: 22px; 
      display: block; 
    }

    .res .count { 
      font-variant-numeric: tabular-nums; 
      min-width: 14px; 
      text-align: center; 
    }

    #goal-display { 
      position: absolute; 
      top: max(55px, calc(env(safe-area-inset-top) + 30px)); 
      left: max(14px, env(safe-area-inset-left)); 
      right: auto; 
      text-align: left; 
      pointer-events: none; 
    }

    #goal-text { 
      display: inline-block; 
      max-width: calc(100vw - 28px);
      overflow-wrap: break-word;
      background: rgba(30, 22, 16, 0.55); 
      backdrop-filter: blur(10px); 
      -webkit-backdrop-filter: blur(10px); 
      padding: 8px 16px; 
      border-radius: 12px; 
      font-size: 13px; 
      font-weight: 600; 
      border: 1px solid rgba(255, 255, 255, 0.12); 
      line-height: 1.4; 
    }

    #goal-text .goal-title { 
      color: #ffd700; 
    }

    #goal-text .goal-cost { 
      font-size: 11px; 
      opacity: 0.8; 
    }

    #move-zone { 
      position: absolute; 
      left: 0; 
      top: auto; 
      bottom: 0; 
      width: 33.333333%; 
      height: 50%; 
      pointer-events: auto; 
      touch-action: none; 
      z-index: 2; 
    }

    #look-area { 
      position: absolute; 
      left: 0; 
      top: 0; 
      width: 100%; 
      height: 100%; 
      pointer-events: auto; 
      touch-action: none; 
      z-index: 1; 
    }

    #joystick { 
      position: absolute; 
      bottom: var(--control-gap); 
      left: var(--control-gap-side); 
      width: var(--joystick-size); 
      height: var(--joystick-size); 
      pointer-events: none; 
      z-index: 3; 
    }

    #joy-base { 
      position: absolute; 
      inset: 0; 
      border-radius: 50%; 
      background: rgba(255, 255, 255, 0.07); 
      border: 2px solid rgba(255, 255, 255, 0.18); 
    }

    #joy-stick { 
      position: absolute; 
      left: 50%; 
      top: 50%; 
      width: var(--joy-stick-size); 
      height: var(--joy-stick-size); 
      border-radius: 50%; 
      background: rgba(255, 255, 255, 0.32); 
      border: 2px solid rgba(255, 255, 255, 0.55); 
      box-shadow: 0 4px 14px rgba(0,0,0,0.3); 
      transform: translate(-50%, -50%); 
      will-change: transform; 
    }

    #action-btn { 
      position: absolute; 
      bottom: var(--control-gap); 
      right: var(--control-gap-side); 
      width: var(--btn-main); 
      height: var(--btn-main); 
      border-radius: 50%; 
      pointer-events: auto; 
      touch-action: none; 
      display: none; 
      align-items: center; 
      justify-content: center; 
      flex-direction: column; 
      color: #fff; 
      font-weight: 800; 
      font-size: var(--font-main); 
      letter-spacing: 0.5px; 
      text-shadow: 0 1px 2px rgba(0,0,0,0.4); 
      border: 2px solid rgba(255,255,255,0.4); 
      cursor: pointer; 
      transition: transform 0.1s; 
      z-index: 3; 
      overflow: hidden;
      text-align: center;
    }

    #action-btn.show { 
      display: flex; 
      animation: pop 0.25s ease-out; 
    }

    #action-btn.chop { 
      background: radial-gradient(circle at 35% 30%, #ffb066, #d97a2c); 
      box-shadow: 0 6px 20px rgba(217, 122, 44, 0.55), inset 0 -4px 8px rgba(0,0,0,0.2); 
    }

    #action-btn.mine { 
      background: radial-gradient(circle at 35% 30%, #c5c0b5, #7a766c); 
      box-shadow: 0 6px 20px rgba(122, 118, 108, 0.55), inset 0 -4px 8px rgba(0,0,0,0.2); 
    }

    #action-btn:active { 
      transform: scale(0.92); 
    }

    #action-btn .label { 
      display: block;
      width: 80%;
      max-width: 80%;
      font-size: var(--font-main);
      line-height: 1;
      letter-spacing: 0.1px;
      white-space: nowrap;
    }

    #action-btn .sub { 
      display: block;
      width: 82%;
      max-width: 82%;
      font-size: var(--font-sub); 
      opacity: 0.9; 
      margin-top: 3px; 
      font-weight: 600;
      line-height: 1.08;
      letter-spacing: 0;
      white-space: normal;
      overflow-wrap: break-word;
    }

    @keyframes pop { 
      0% { transform: scale(0.5); opacity: 0; } 
      100% { transform: scale(1); opacity: 1; } 
    }

    #plant-btn { 
      position: absolute; 
      bottom: calc(var(--control-gap) + var(--btn-main) + var(--btn-gap)); 
      right: calc(var(--control-gap-side) + var(--btn-main) * 0.12); 
      width: var(--btn-sub); 
      height: var(--btn-sub); 
      border-radius: 50%; 
      pointer-events: auto; 
      touch-action: none; 
      display: none; 
      align-items: center; 
      justify-content: center; 
      flex-direction: column; 
      color: #fff; 
      font-weight: 800; 
      font-size: clamp(7px, calc(var(--btn-sub) * 0.13), 10px);
      letter-spacing: 0;
      text-shadow: 0 1px 2px rgba(0,0,0,0.4); 
      border: 2px solid rgba(255,255,255,0.4); 
      cursor: pointer; 
      transition: transform 0.1s; 
      z-index: 3; 
      background: radial-gradient(circle at 35% 30%, #88e66c, #2a8a2a); 
      box-shadow: 0 6px 20px rgba(42, 138, 42, 0.55), inset 0 -4px 8px rgba(0,0,0,0.2); 
      overflow: hidden;
      text-align: center;
    }

    #plant-btn.show { 
      display: flex; 
      animation: pop 0.25s ease-out; 
    }

    #plant-btn:active { 
      transform: scale(0.92); 
    }

    #upgrade-btn { 
      position: absolute; 
      bottom: calc(var(--control-gap) + var(--btn-main) + var(--btn-sub) + var(--btn-gap) * 2); 
      right: calc(var(--control-gap-side) + var(--btn-main) * 0.12); 
      width: var(--btn-sub); 
      height: var(--btn-sub); 
      border-radius: 50%; 
      pointer-events: auto; 
      touch-action: none; 
      display: none; 
      align-items: center; 
      justify-content: center; 
      flex-direction: column; 
      color: #fff; 
      font-weight: 800; 
      font-size: clamp(7px, calc(var(--btn-sub) * 0.13), 10px);
      letter-spacing: 0;
      text-shadow: 0 1px 2px rgba(0,0,0,0.4); 
      border: 2px solid rgba(255,255,255,0.4); 
      cursor: pointer; 
      transition: transform 0.1s; 
      z-index: 3; 
      background: radial-gradient(circle at 35% 30%, #f1c40f, #d4ac0d); 
      box-shadow: 0 6px 20px rgba(241, 196, 15, 0.55), inset 0 -4px 8px rgba(0,0,0,0.2); 
      overflow: hidden;
      text-align: center;
    }

    #plant-btn .label,
    #upgrade-btn .label {
      display: block;
      width: 82%;
      max-width: 82%;
      line-height: 1;
      white-space: nowrap;
    }

    #plant-btn .label {
      width: 100%;
      max-width: none;
      text-align: center;
    }

    #upgrade-btn.show { 
      display: flex; 
      animation: pop 0.25s ease-out; 
    }

    #upgrade-btn:active { 
      transform: scale(0.92); 
    }

    #hp-bar-container { 
      position: absolute; 
      width: 60px; 
      height: 8px; 
      background: rgba(0,0,0,0.5); 
      border-radius: 4px; 
      display: none; 
      pointer-events: none; 
      z-index: 6; 
      border: 1px solid rgba(0,0,0,0.3); 
      overflow: hidden; 
    }

    #hp-bar-fill { 
      width: 100%; 
      height: 100%; 
      background: #5ce65c; 
      transition: width 0.1s; 
    }

    #win-screen { 
      position: absolute; 
      inset: 0; 
      background: rgba(0, 0, 0, 0.8); 
      backdrop-filter: blur(10px); 
      -webkit-backdrop-filter: blur(10px); 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      z-index: 20; 
      opacity: 0; 
      pointer-events: none; 
      transition: opacity 0.5s; 
    }

    #win-screen.show { 
      opacity: 1; 
      pointer-events: auto; 
    }

    #win-screen h1 { 
      max-width: calc(100vw - 32px);
      font-size: clamp(28px, 8vw, 36px);
      color: #ffd700; 
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.5); 
      margin-bottom: 10px; 
      text-align: center; 
    }

    #win-screen p { 
      font-size: 16px; 
      color: #fff; 
      opacity: 0.8; 
      margin-bottom: 25px; 
      padding: 0 16px;
      text-align: center;
    }

    #win-continue-btn { 
      padding: 12px 24px; 
      font-size: 18px; 
      font-weight: bold; 
      background: #5ce65c; 
      color: #000; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
      transition: transform 0.1s; 
      pointer-events: none; 
    }

    #win-screen.show #win-continue-btn {
      pointer-events: auto;
    }

    #win-continue-btn:active { 
      transform: scale(0.95); 
    }

    #login-screen { 
      position: fixed; 
      inset: 0; 
      background: #111; 
      z-index: 50; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      padding: 20px; 
    }

    #login-box { 
      background: rgba(30, 22, 16, 0.85); 
      border: 1px solid rgba(255,255,255,0.2); 
      padding: 30px; 
      border-radius: 16px; 
      text-align: center; 
      backdrop-filter: blur(10px); 
      -webkit-backdrop-filter: blur(10px); 
      width: 100%; 
      max-width: 300px; 
    }

    #login-box h2 { 
      color: #fff; 
      margin-bottom: 20px; 
      font-size: 24px; 
    }

    #login-input { 
      padding: 12px 16px; 
      font-size: 16px; 
      border: none; 
      border-radius: 8px; 
      margin-bottom: 15px; 
      width: 100%; 
      text-align: center; 
      outline: none; 
    }

    #login-btn { 
      padding: 12px 24px; 
      font-size: 16px; 
      font-weight: bold; 
      background: #5ce65c; 
      color: #000; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
      width: 100%; 
      transition: transform 0.1s; 
    }

    #login-btn:active { 
      transform: scale(0.95); 
    }
    
    #letter-screen { 
      position: fixed; 
      inset: 0; 
      background: rgba(0,0,0,0.9); 
      z-index: 100; 
      display: none; 
      align-items: center; 
      justify-content: center; 
      padding: 20px; 
      pointer-events: auto; 
      overflow-y: auto; 
    }

    #letter-screen.show { 
      display: flex; 
    }

    #letter-box { 
      background: #fdfbf7; 
      color: #2c2c2c; 
      padding: 40px; 
      border-radius: 8px; 
      max-width: 600px; 
      width: 100%; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
      font-family: 'Georgia', serif; 
      position: relative; 
      margin: auto; 
    }

    #letter-box::before { 
      content: ''; 
      position: absolute; 
      top: 10px; 
      left: 10px; 
      right: 10px; 
      bottom: 10px; 
      border: 1px solid #e2d9c3; 
      border-radius: 4px; 
      pointer-events: none; 
    }

    .letter-title { 
      font-size: 28px; 
      color: #b56576; 
      margin-bottom: 20px; 
      text-align: center; 
      font-style: italic; 
    }

    .letter-body { 
      font-size: 16px; 
      line-height: 1.6; 
      margin-bottom: 20px; 
      white-space: pre-wrap; 
    }

  </style>
</head>
<body>
<div id="login-screen">
  <div id="login-box">
    <h2>Доступ к острову</h2>
    <input type="password" id="login-input" placeholder="Введите пароль">
    <button id="login-btn">Войти</button>
  </div>
</div>

<div id="game-wrapper">
  <div id="game-container">
    <canvas id="gl"></canvas>
  </div>
</div>

<div id="ui">
  <div id="res-group">
    <div class="res">
      <svg viewBox="0 0 24 24">
        <rect x="4" y="9" width="16" height="6" rx="3" fill="#b27a4a" stroke="#6b4322" stroke-width="1.5"/>
        <circle cx="5.5" cy="12" r="2" fill="#a06a3a"/>
        <circle cx="18.5" cy="12" r="2" fill="#a06a3a"/>
      </svg>
      <span class="count" id="wood-count">0</span>
    </div>
    <div class="res">
      <svg viewBox="0 0 24 24">
        <path d="M5 16L4 12L8 7L16 7L20 12L19 16L14 18L10 18Z" fill="#c5c0b5" stroke="#7a766c" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
      <span class="count" id="stone-count">0</span>
    </div>
    <div class="res">
      <svg viewBox="0 0 24 24">
        <path d="M12 20V10M12 10C12 6 8 4 4 6C6 10 10 10 12 10ZM12 10C12 6 16 4 20 6C18 10 14 10 12 10Z" fill="#5ce65c" stroke="#2a8a2a" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
      <span class="count" id="sapling-count">0</span>
    </div>
  </div>

  <div id="goal-display">
    <div id="goal-text">
      <div class="goal-title" id="goal-title">Цель: Железные инструменты — рубка и добыча ×1,5</div>
      <div class="goal-cost" id="goal-cost">Стоимость: 30 дерева, 13 камня</div>
    </div>
  </div>

  <div id="move-zone"></div>
  <div id="look-area"></div>
  <div id="joystick">
    <div id="joy-base"></div>
    <div id="joy-stick"></div>
  </div>
  
  <div id="action-btn">
    <span class="label">ЗАЖМИ</span>
    <span class="sub" id="action-sub">Рубить дерево</span>
  </div>
  <div id="plant-btn">
    <span class="label">ПОСАДИТЬ</span>
  </div>
  <div id="upgrade-btn">
    <span class="label">СОЗДАТЬ</span>
  </div>
  
  <div id="hp-bar-container">
    <div id="hp-bar-fill"></div>
  </div>
  
  <div id="win-screen">
    <h1>ВЫ СПАСЛИСЬ!</h1>
    <p>Спасибо за игру «Уютный остров».</p>
    <button id="win-continue-btn">Продолжить</button>
  </div>
</div>

<div id="letter-screen">
  <div id="letter-box">
    <div class="letter-title" id="letter-title"></div>
    <div class="letter-body" id="letter-body"></div>
  </div>
</div>

<script>
'use strict';

const M4 = {
  create: () => {
    return new Float32Array(16);
  },

  identity: (o) => {
    o = o || new Float32Array(16);
    o.fill(0);
    o[0] = 1;
    o[5] = 1;
    o[10] = 1;
    o[15] = 1;
    return o;
  },

  perspective: (o, fov, asp, n, f) => {
    o = o || new Float32Array(16);
    const t = 1 / Math.tan(fov / 2);
    const nf = 1 / (n - f);
    o[0] = t / asp;
    o[1] = 0;
    o[2] = 0;
    o[3] = 0;
    o[4] = 0;
    o[5] = t;
    o[6] = 0;
    o[7] = 0;
    o[8] = 0;
    o[9] = 0;
    o[10] = (f + n) * nf;
    o[11] = -1;
    o[12] = 0;
    o[13] = 0;
    o[14] = 2 * f * n * nf;
    o[15] = 0;
    return o;
  },

  orthographic: (o, l, r, b, t, n, f) => {
    o = o || new Float32Array(16);
    const lr = 1 / (l - r);
    const bt = 1 / (b - t);
    const nf = 1 / (n - f);
    o[0] = -2 * lr;
    o[1] = 0;
    o[2] = 0;
    o[3] = 0;
    o[4] = 0;
    o[5] = -2 * bt;
    o[6] = 0;
    o[7] = 0;
    o[8] = 0;
    o[9] = 0;
    o[10] = 2 * nf;
    o[11] = 0;
    o[12] = (l + r) * lr;
    o[13] = (t + b) * bt;
    o[14] = (f + n) * nf;
    o[15] = 1;
    return o;
  },

  lookAt: (o, e, c, u) => {
    o = o || new Float32Array(16);
    let z0 = e[0] - c[0];
    let z1 = e[1] - c[1];
    let z2 = e[2] - c[2];
    let l = 1 / Math.hypot(z0, z1, z2);
    z0 *= l;
    z1 *= l;
    z2 *= l;

    let x0 = u[1] * z2 - u[2] * z1;
    let x1 = u[2] * z0 - u[0] * z2;
    let x2 = u[0] * z1 - u[1] * z0;
    l = Math.hypot(x0, x1, x2);
    
    if (l === 0) {
      x0 = 0;
      x1 = 0;
      x2 = 0;
    } else {
      l = 1 / l;
      x0 *= l;
      x1 *= l;
      x2 *= l;
    }

    const y0 = z1 * x2 - z2 * x1;
    const y1 = z2 * x0 - z0 * x2;
    const y2 = z0 * x1 - z1 * x0;

    o[0] = x0;
    o[1] = y0;
    o[2] = z0;
    o[3] = 0;
    o[4] = x1;
    o[5] = y1;
    o[6] = z1;
    o[7] = 0;
    o[8] = x2;
    o[9] = y2;
    o[10] = z2;
    o[11] = 0;
    o[12] = -(x0 * e[0] + x1 * e[1] + x2 * e[2]);
    o[13] = -(y0 * e[0] + y1 * e[1] + y2 * e[2]);
    o[14] = -(z0 * e[0] + z1 * e[1] + z2 * e[2]);
    o[15] = 1;
    return o;
  },

  multiply: (o, a, b) => {
    o = o || new Float32Array(16);
    const a00 = a[0]; const a01 = a[1]; const a02 = a[2]; const a03 = a[3];
    const a10 = a[4]; const a11 = a[5]; const a12 = a[6]; const a13 = a[7];
    const a20 = a[8]; const a21 = a[9]; const a22 = a[10]; const a23 = a[11];
    const a30 = a[12]; const a31 = a[13]; const a32 = a[14]; const a33 = a[15];

    for (let i = 0; i < 4; i++) {
      const b0 = b[i * 4];
      const b1 = b[i * 4 + 1];
      const b2 = b[i * 4 + 2];
      const b3 = b[i * 4 + 3];
      o[i * 4] = b0 * a00 + b1 * a10 + b2 * a20 + b3 * a30;
      o[i * 4 + 1] = b0 * a01 + b1 * a11 + b2 * a21 + b3 * a31;
      o[i * 4 + 2] = b0 * a02 + b1 * a12 + b2 * a22 + b3 * a32;
      o[i * 4 + 3] = b0 * a03 + b1 * a13 + b2 * a23 + b3 * a33;
    }
    return o;
  },

  translate: (o, a, v) => {
    o = o || new Float32Array(16);
    const x = v[0];
    const y = v[1];
    const z = v[2];

    if (a !== o) {
      o[0] = a[0];
      o[1] = a[1];
      o[2] = a[2];
      o[3] = a[3];
      o[4] = a[4];
      o[5] = a[5];
      o[6] = a[6];
      o[7] = a[7];
      o[8] = a[8];
      o[9] = a[9];
      o[10] = a[10];
      o[11] = a[11];
    }
    o[12] = a[0] * x + a[4] * y + a[8] * z + a[12];
    o[13] = a[1] * x + a[5] * y + a[9] * z + a[13];

function hash2(x, y) {
  let n = (x * 374761393 + y * 668265263) | 0;
  n = (n ^ (n >> 13)) * 1274126177 | 0;
  return ((n ^ (n >> 16)) & 0x7fffffff) / 0x7fffffff;
}

function noise2D(x, y) {
  const ix = Math.floor(x);
  const iy = Math.floor(y);
  const fx = x - ix;
  const fy = y - iy;
  const a = hash2(ix, iy);
  const b = hash2(ix + 1, iy);
  const c = hash2(ix, iy + 1);
  const d = hash2(ix + 1, iy + 1);
  const ux = fx * fx * (3 - 2 * fx);
  const uy = fy * fy * (3 - 2 * fy);
  return a * (1 - ux) * (1 - uy) + b * ux * (1 - uy) + c * (1 - ux) * uy + d * ux * uy;
}

function fbm(x, y, octaves) {
  let v = 0;
  let amp = 1;
  let freq = 1;
  let max = 0;
  for (let i = 0; i < octaves; i++) {
    v += noise2D(x * freq, y * freq) * amp;
    max += amp;
    amp *= 0.5;
    freq *= 2;
  }
  return v / max;
}

const ISLAND_RADIUS = 32;
const SHADOW_MAP_SIZE = 2048;
const SHADOW_ORTHO_SIZE = 25;
const SHADOW_TEXEL_WORLD_SIZE = (2 * SHADOW_ORTHO_SIZE) / SHADOW_MAP_SIZE;

function heightAt(x, z) {
  const r = Math.sqrt(x * x + z * z);
  const d = r / ISLAND_RADIUS;
  let h = Math.cos(Math.min(d, 1) * Math.PI * 0.5) * 5.5;
  h += (fbm(x * 0.06, z * 0.06, 4) - 0.5) * 4.5;
  h += (fbm(x * 0.18, z * 0.18, 3) - 0.5) * 1.2;
  
  if (d > 1) {
    const t = Math.min((d - 1) * 1.6, 1);
    h = h * (1 - t) - 5.5 * t;
  }
  if (h > -0.4 && h < 1.0) {
    h = h * 0.55 + 0.15;
  }
  return h;
}

const SHADOW_FILTER_GLSL = `
uniform sampler2D uShadowMap;

const float SHADOW_MAP_SIZE = ${SHADOW_MAP_SIZE.toFixed(1)};
const vec2 SHADOW_TEXEL_SIZE = vec2(1.0 / SHADOW_MAP_SIZE);

float unpackShadowDepth(vec4 color) {
  const vec4 bitShifts = vec4(
    1.0,
    1.0 / 255.0,
    1.0 / (255.0 * 255.0),
    1.0 / (255.0 * 255.0 * 255.0)
  );
  return dot(color, bitShifts);
}

float readShadowDepth(vec2 uv) {
  vec2 halfTexel = SHADOW_TEXEL_SIZE * 0.5;
  vec2 sampleUv = clamp(uv, halfTexel, vec2(1.0) - halfTexel);
  return unpackShadowDepth(texture2D(uShadowMap, sampleUv));
}

float compareShadowDepth(vec2 uv, float receiverDepth, float bias) {
  float closestDepth = readShadowDepth(uv);
  float transition = 0.0015;
  return smoothstep(
    receiverDepth - bias - transition,
    receiverDepth - bias + transition,
    closestDepth
  );
}

vec2 findShadowBlockers(vec2 uv, float receiverDepth, float bias) {
  float blockerDepthSum = 0.0;
  float blockerCount = 0.0;

  for (int x = -1; x <= 1; x++) {
    for (int y = -1; y <= 1; y++) {
      vec2 offset = vec2(float(x), float(y)) * SHADOW_TEXEL_SIZE * 4.0;
      float sampleDepth = readShadowDepth(uv + offset);
      if (sampleDepth < receiverDepth - bias) {
        blockerDepthSum += sampleDepth;
        blockerCount += 1.0;
      }
    }
  }

  return vec2(blockerDepthSum / max(blockerCount, 1.0), blockerCount);
}

float sampleShadowBilinear(vec2 uv, float receiverDepth, float bias) {
  vec2 texelPosition = uv * SHADOW_MAP_SIZE - 0.5;
  vec2 baseTexel = floor(texelPosition);
  vec2 blend = fract(texelPosition);
  vec2 baseUv = (baseTexel + 0.5) * SHADOW_TEXEL_SIZE;

  float bottomLeft = compareShadowDepth(baseUv, receiverDepth, bias);
  float bottomRight = compareShadowDepth(baseUv + vec2(SHADOW_TEXEL_SIZE.x, 0.0), receiverDepth, bias);
  float topLeft = compareShadowDepth(baseUv + vec2(0.0, SHADOW_TEXEL_SIZE.y), receiverDepth, bias);
  float topRight = compareShadowDepth(baseUv + SHADOW_TEXEL_SIZE, receiverDepth, bias);

  return mix(
    mix(bottomLeft, bottomRight, blend.x),
    mix(topLeft, topRight, blend.x),
    blend.y
  );
}

float getShadowVisibility() {
  vec3 shadowCoord = vShadowCoord.xyz / vShadowCoord.w;
  shadowCoord = shadowCoord * 0.5 + 0.5;

  if (
    shadowCoord.x < 0.0 || shadowCoord.x > 1.0 ||
    shadowCoord.y < 0.0 || shadowCoord.y > 1.0 ||
    shadowCoord.z < 0.0 || shadowCoord.z > 1.0
  ) {
    return 1.0;
  }

  vec3 normal = normalize(vNormal);
  vec3 lightDirection = normalize(-uLightDir);
  float normalLight = max(dot(normal, lightDirection), 0.0);
  float bias = mix(0.0055, 0.0018, normalLight);
  vec2 blockerData = findShadowBlockers(shadowCoord.xy, shadowCoord.z, bias);

  if (blockerData.y < 0.5) {
    return 1.0;
  }

  float depthSeparation = max(shadowCoord.z - blockerData.x, 0.0);
  float filterRadius = clamp(1.5 + depthSeparation * 180.0, 1.5, 6.0);
  float visibility = 0.0;
  float totalWeight = 0.0;

  for (int x = -2; x <= 1; x++) {
    for (int y = -2; y <= 1; y++) {
      vec2 tap = vec2(float(x) + 0.5, float(y) + 0.5);
      float weight = (2.0 - abs(tap.x)) * (2.0 - abs(tap.y));
      vec2 offset = tap * (filterRadius / 1.5) * SHADOW_TEXEL_SIZE;
      visibility += sampleShadowBilinear(
        shadowCoord.xy + offset,
        shadowCoord.z,
        bias
      ) * weight;
      totalWeight += weight;
    }
  }

  return visibility / totalWeight;
}
`;

const FS_TERRAIN = `
precision highp float;

varying vec3 vNormal;
varying vec3 vWorldPos;
varying vec4 vShadowCoord;

uniform vec3 uLightDir;
uniform vec3 uCameraPos;
uniform vec3 uFogColor;
uniform vec3 uAmbientColor;
uniform vec3 uLightColor;
uniform float uFogNear;
uniform float uFogFar;

${SHADOW_FILTER_GLSL}

float hash21(vec2 p) {
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
}

float valueNoise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    float a = hash21(i);
    float b = hash21(i + vec2(1.0, 0.0));
    float c = hash21(i + vec2(0.0, 1.0));
    float d = hash21(i + vec2(1.0, 1.0));
    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

void main() {
  vec3 N = normalize(vNormal);
  vec3 L = normalize(-uLightDir);
  float diff = max(dot(N, L), 0.0);
  float h = vWorldPos.y;
  vec3 sand = vec3(0.92, 0.83, 0.60);
  vec3 grassLight = vec3(0.46, 0.66, 0.34);
  vec3 grassDark = vec3(0.32, 0.55, 0.26);
  vec3 rock = vec3(0.52, 0.48, 0.44);
  vec3 base;
  
  if (h < 0.18) {
      base = sand;
  } else if (h < 0.9) {
      base = mix(sand, grassLight, smoothstep(0.18, 0.9, h));
  } else if (h < 4.5) {
      base = mix(grassLight, grassDark, smoothstep(0.9, 4.5, h));
  } else {
      base = mix(grassDark, rock, smoothstep(4.5, 7.5, h));
  }
  
  float detail = valueNoise(vWorldPos.xz * 0.32) * 0.07 - 0.035;
  float broadVariation = valueNoise(vWorldPos.xz * 0.075) * 0.10 - 0.05;
  base += detail + broadVariation;
  base *= mix(0.94, 1.06, valueNoise(vWorldPos.xz * 0.14));
  
  float shadow = mix(0.38, 1.0, getShadowVisibility());
  vec3 color = base * (uAmbientColor + diff * shadow * uLightColor);
  vec3 viewDir = normalize(uCameraPos - vWorldPos);
  float rim = pow(1.0 - max(dot(N, viewDir), 0.0), 3.0);
  color += vec3(0.035, 0.055, 0.045) * rim * (0.35 + diff * 0.65);
  
  float dist = length(vWorldPos - uCameraPos);
  float fog = clamp((dist - uFogNear) / (uFogFar - uFogNear), 0.0, 1.0);
  color = mix(color, uFogColor, fog);
  gl_FragColor = vec4(color, 1.0);
}
`;

uniform vec3 uSunColor;

  float sun = smoothstep(0.05, 0.0, sunDist);
  float sunGlow = smoothstep(0.5, 0.0, sunDist) * 0.3;

function base64ToBytes(value) {
  const binary = atob(value);

  }

}

async function decryptLetterPayload(password) {
  if (!window.crypto || !window.crypto.subtle) {
    throw new Error('Web Crypto is unavailable');
  }
  const encoder = new TextEncoder();
  const material = await window.crypto.subtle.importKey(
    'raw', encoder.encode(password), 'PBKDF2', false, ['deriveKey']
  );
  const key = await window.crypto.subtle.deriveKey(
    {
      name: 'PBKDF2',
      salt: base64ToBytes(ENCRYPTED_LETTER.salt),
      iterations: ENCRYPTED_LETTER.iterations,
      hash: 'SHA-256'
    },
    material,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );
  const plaintext = await window.crypto.subtle.decrypt(
    {
      name: 'AES-GCM',
      iv: base64ToBytes(ENCRYPTED_LETTER.iv),
      additionalData: encoder.encode('cozy-island-letter-v1'),
      tagLength: 128
    },
    key,
    base64ToBytes(ENCRYPTED_LETTER.ciphertext)
  );
  const payload = JSON.parse(new TextDecoder().decode(plaintext));
  if (!payload || typeof payload.title !== 'string' || typeof payload.body !== 'string' || Object.keys(payload).length !== 2) {
    throw new Error('Invalid letter payload');
  }
  return Object.freeze({ title: payload.title, body: payload.body });
}

      context.resume().catch(() => {});
      return true;
    }

    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return false;

    context = new AudioContextClass();
    masterGain = context.createGain();
    masterGain.gain.value = 0.34;
    compressor = context.createDynamicsCompressor();
    compressor.threshold.value = -18;
    compressor.knee.value = 16;
    compressor.ratio.value = 3;
    compressor.attack.value = 0.004;
    compressor.release.value = 0.16;
    masterGain.connect(compressor);
    compressor.connect(context.destination);
    generateLibrary();
    initialized = true;
    context.resume().catch(() => {});
    return true;
  }

  let nextPickupTime = 0;

  function play(name, options = {}) {
    if (!initialized || muted || document.hidden || context.state !== 'running') return;
    const variants = cache.get(name);
    if (!variants || variants.length === 0) return;
    if (name === 'pickup') {
      if (context.currentTime < nextPickupTime) return;
      nextPickupTime = context.currentTime + 0.065;
    }

    if (voices.size >= 16) return;

    const source = context.createBufferSource();
    const gain = context.createGain();
    const panner = context.createStereoPanner ? context.createStereoPanner() : null;
    const previousVariant = lastVariants.get(name);
    let variant = Math.floor(Math.random() * (variants.length - (previousVariant === undefined ? 0 : 1)));
    if (previousVariant !== undefined && variant >= previousVariant) variant++;
    if (variants.length === 1) variant = 0;
    lastVariants.set(name, variant);
    const buffer = variants[variant];
    const now = context.currentTime;
    source.buffer = buffer;
    source.playbackRate.value = options.rate || 1;
    gain.gain.setValueAtTime(clamp(options.volume === undefined ? 1 : options.volume, 0, 1.5), now);
    source.connect(gain);
    if (panner) {
      panner.pan.value = clamp(options.pan || 0, -0.6, 0.6);
      gain.connect(panner);
      panner.connect(masterGain);
    } else {
      gain.connect(masterGain);
    }
    source.onended = () => {
      voices.delete(source);
      source.disconnect();
      gain.disconnect();
      if (panner) panner.disconnect();
    };
    voices.add(source);
    source.start(now);
  }

  function pause() {
    if (!initialized) return;
    for (const source of voices) source.stop();
    voices.clear();
    nextPickupTime = 0;
    context.suspend().catch(() => {});
  }

  function resume() {
    if (initialized && !document.hidden) context.resume().catch(() => {});
  }

  function toggle() {
    if (!initialized && !init()) return;
    muted = !muted;
    masterGain.gain.setTargetAtTime(muted ? 0 : 0.34, context.currentTime, 0.015);
  }

  return { init, play, toggle, pause, resume };
})();

function compileShader(src, type) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
    throw new Error('Ошибка компиляции шейдера');
  }
  return s;
}

function createProgram(vsSrc, fsSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compileShader(vsSrc, gl.VERTEX_SHADER));
  gl.attachShader(p, compileShader(fsSrc, gl.FRAGMENT_SHADER));
  gl.linkProgram(p);
  
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(p));
    throw new Error('Ошибка компоновки программы');
  }
  
  const obj = { 
    program: p, 
    attribs: {}, 
    uniforms: {} 
  };
  
  const nA = gl.getProgramParameter(p, gl.ACTIVE_ATTRIBUTES);
  for (let i = 0; i < nA; i++) {
    const info = gl.getActiveAttrib(p, i);
    obj.attribs[info.name] = gl.getAttribLocation(p, info.name);
  }
  
  const nU = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < nU; i++) {
    const info = gl.getActiveUniform(p, i);
    obj.uniforms[info.name] = gl.getUniformLocation(p, info.name);
  }
  return obj;
}

function createMesh(positions, normals, indices, colors) {
  const m = {};
  m.posBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, m.posBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.STATIC_DRAW);
  
  if (normals) {
    m.nrmBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, m.nrmBuf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(normals), gl.STATIC_DRAW);
  } else {
    m.nrmBuf = null;
  }
  
  if (colors) {
    m.colBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, m.colBuf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(colors), gl.STATIC_DRAW);
  } else {
    m.colBuf = null;
  }
  
  m.idxBuf = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, m.idxBuf);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(indices), gl.STATIC_DRAW);
  m.count = indices.length;
  
  return m;
}

function bindAttrib(program, name, buffer, size, stride, offset) {
  const loc = program.attribs[name];
  if (loc === undefined || loc < 0) {
    return;
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, size, gl.FLOAT, false, stride || 0, offset || 0);
}

function drawMesh(mesh, model, program) {
  if (boundMesh !== mesh || boundMeshProgram !== program) {
    bindAttrib(program, 'aPos', mesh.posBuf, 3);
    bindAttrib(program, 'aNormal', mesh.nrmBuf, 3);
    if (mesh.colBuf) {
      bindAttrib(program, 'aColor', mesh.colBuf, 3);
    }
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, mesh.idxBuf);
    boundMesh = mesh;
    boundMeshProgram = program;
  }
  gl.uniformMatrix4fv(program.uniforms.uModel, false, model);
  gl.drawElements(gl.TRIANGLES, mesh.count, gl.UNSIGNED_SHORT, 0);
}

function drawMeshDepth(mesh, model, program) {
  if (boundMesh !== mesh || boundMeshProgram !== program) {
    bindAttrib(program, 'aPos', mesh.posBuf, 3);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, mesh.idxBuf);
    boundMesh = mesh;
    boundMeshProgram = program;
  }
  gl.uniformMatrix4fv(program.uniforms.uModel, false, model);
  gl.drawElements(gl.TRIANGLES, mesh.count, gl.UNSIGNED_SHORT, 0);
}

function generateTerrain() {
  const SIZE = 80;
  const SEG = 96;
  const positions = [];
  const normals = [];
  const indices = [];
  
  for (let z = 0; z <= SEG; z++) {
    for (let x = 0; x <= SEG; x++) {
      const px = (x / SEG - 0.5) * SIZE;
      const pz = (z / SEG - 0.5) * SIZE;
      positions.push(px, heightAt(px, pz), pz);
      normals.push(0, 0, 0);
    }
  }
  
  for (let z = 0; z < SEG; z++) {
    for (let x = 0; x < SEG; x++) {
      const i = z * (SEG + 1) + x;
      indices.push(i, i + SEG + 1, i + 1);
      indices.push(i + 1, i + SEG + 1, i + SEG + 2);
    }
  }
  
  for (let i = 0; i < indices.length; i += 3) {
    const a = indices[i];
    const b = indices[i + 1];
    const c = indices[i + 2];
    
    const ax = positions[a * 3];
    const ay = positions[a * 3 + 1];
    const az = positions[a * 3 + 2];
    
    const bx = positions[b * 3];
    const by = positions[b * 3 + 1];
    const bz = positions[b * 3 + 2];
    
    const cx = positions[c * 3];
    const cy = positions[c * 3 + 1];
    const cz = positions[c * 3 + 2];
    
    const ux = bx - ax;
    const uy = by - ay;
    const uz = bz - az;
    
    const vx = cx - ax;
    const vy = cy - ay;
    const vz = cz - az;
    
    const nx = uy * vz - uz * vy;
    const ny = uz * vx - ux * vz;
    const nz = ux * vy - uy * vx;
    
    normals[a * 3] += nx;
    normals[a * 3 + 1] += ny;
    normals[a * 3 + 2] += nz;
    
    normals[b * 3] += nx;
    normals[b * 3 + 1] += ny;
    normals[b * 3 + 2] += nz;
    
    normals[c * 3] += nx;
    normals[c * 3 + 1] += ny;
    normals[c * 3 + 2] += nz;
  }
  
  for (let i = 0; i < normals.length; i += 3) {
    const l = Math.hypot(normals[i], normals[i + 1], normals[i + 2]) || 1;
    normals[i] /= l;
    normals[i + 1] /= l;
    normals[i + 2] /= l;
  }
  
  return createMesh(positions, normals, indices);
}

function generateSkyDome() {
  const positions = [];
  const indices = [];
  const radius = 100.0;
  const segs = 16;
  
  for (let y = 0; y <= segs; y++) {
    const phi = (y / segs) * Math.PI;
    for (let x = 0; x <= segs; x++) {
      const theta = (x / segs) * Math.PI * 2;
      const nx = Math.sin(phi) * Math.cos(theta);
      const ny = Math.cos(phi);
      const nz = Math.sin(phi) * Math.sin(theta);
      positions.push(nx * radius, ny * radius, nz * radius);
    }
  }
  
  const row = segs + 1;
  for (let y = 0; y < segs; y++) {
    for (let x = 0; x < segs; x++) {
      const i = y * row + x;
      indices.push(i, i + 1, i + row);
      indices.push(i + 1, i + row + 1, i + row);
    }
  }
  
  return createMesh(positions, null, indices, null);
}

function generateTree() {
  const positions = [];
  const normals = [];
  const colors = [];
  const indices = [];
  
  const trunkColor = [0.36, 0.23, 0.12];
  const foliageColor = [0.22, 0.45, 0.20];
  const trunkH = 1.7;
  const trunkR = 0.16;
  const segH = 4;
  const segR = 6;
  
  for (let h = 0; h <= segH; h++) {
    const y = (h / segH) * trunkH;
    const r = trunkR * (1 - h / segH * 0.18);
    for (let s = 0; s <= segR; s++) {
      const a = (s / segR) * Math.PI * 2;
      positions.push(Math.cos(a) * r, y, Math.sin(a) * r);
      normals.push(Math.cos(a), 0, Math.sin(a));
      colors.push(trunkColor[0], trunkColor[1], trunkColor[2]);
    }
  }
  
  for (let h = 0; h < segH; h++) {
    for (let s = 0; s < segR; s++) {
      const a = h * (segR + 1) + s;
      const b = a + segR + 1;
      indices.push(a, b, a + 1);
      indices.push(a + 1, b, b + 1);
    }
  }
  
  const layers = [
    { y: 1.2, r: 1.05, h: 1.35 },
    { y: 1.95, r: 0.85, h: 1.15 },
    { y: 2.6, r: 0.55, h: 0.95 },
  ];
  
  for (let i = 0; i < layers.length; i++) {
    const f = layers[i];
    const offset = positions.length / 3;
    const seg = 8;
    const sl = Math.atan2(f.r, f.h);
    const ny = Math.cos(sl);
    const nr = Math.sin(sl);
    
    for (let s = 0; s <= seg; s++) {
      const a = (s / seg) * Math.PI * 2;
      positions.push(Math.cos(a) * f.r, f.y, Math.sin(a) * f.r);
      normals.push(Math.cos(a) * nr, ny, Math.sin(a) * nr);
      colors.push(foliageColor[0], foliageColor[1], foliageColor[2]);
    }
    
    const apex = positions.length / 3;
    positions.push(0, f.y + f.h, 0);
    normals.push(0, 1, 0);
    colors.push(foliageColor[0], foliageColor[1], foliageColor[2]);
    
    const baseCenter = positions.length / 3;
    positions.push(0, f.y, 0);
    normals.push(0, -1, 0);
    colors.push(foliageColor[0], foliageColor[1], foliageColor[2]);
    
    for (let s = 0; s < seg; s++) {
      indices.push(offset + s, apex, offset + s + 1);
      indices.push(baseCenter, offset + s, offset + s + 1);
    }
  }
  
  return createMesh(positions, normals, indices, colors);
}

function generateRock() {
  const positions = [];
  const normals = [];
  const colors = [];
  const indices = [];
  
  const t = (1 + Math.sqrt(5)) / 2;
  
  const verts = [
    [-1, t, 0], 
    [1, t, 0], 
    [-1, -t, 0], 
    [1, -t, 0],
    [0, -1, t], 
    [0, 1, t], 
    [0, -1, -t], 
    [0, 1, -t],
    [t, 0, -1], 
    [t, 0, 1], 
    [-t, 0, -1], 
    [-t, 0, 1],
  ];
  
  const faces = [
    [0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11],
    [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8],
    [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9],
    [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1],
  ];
  
  const displaced = [];
  for (let i = 0; i < verts.length; i++) {
    const v = verts[i];
    const l = Math.hypot(v[0], v[1], v[2]);
    const r = 0.7 + hash2(v[0] * 100, v[1] * 100) * 0.45;
    displaced.push([v[0] / l * r, v[1] / l * r * 0.65, v[2] / l * r]);
  }
  
  const rockColor = [0.52, 0.48, 0.44];
  
  for (let i = 0; i < faces.length; i++) {
    const f = faces[i];
    const a = displaced[f[0]];
    const b = displaced[f[1]];
    const c = displaced[f[2]];
    
    const ux = b[0] - a[0];
    const uy = b[1] - a[1];
    const uz = b[2] - a[2];
    
    const vx = c[0] - a[0];
    const vy = c[1] - a[1];
    const vz = c[2] - a[2];
    
    let nx = uy * vz - uz * vy;
    let ny = uz * vx - ux * vz;
    let nz = ux * vy - uy * vx;
    
    const l = Math.hypot(nx, ny, nz) || 1;
    nx /= l;
    ny /= l;
    nz /= l;
    
    const idx = positions.length / 3;
    
    positions.push(a[0], a[1], a[2]);
    positions.push(b[0], b[1], b[2]);
    positions.push(c[0], c[1], c[2]);
    
    normals.push(nx, ny, nz);
    normals.push(nx, ny, nz);
    normals.push(nx, ny, nz);
    
    colors.push(rockColor[0], rockColor[1], rockColor[2]);
    colors.push(rockColor[0], rockColor[1], rockColor[2]);
    colors.push(rockColor[0], rockColor[1], rockColor[2]);
    
    indices.push(idx, idx + 1, idx + 2);
  }
  
  return createMesh(positions, normals, indices, colors);
}

function generateStoneChunk() {
  const positions = [];
  const normals = [];
  const colors = [];
  const indices = [];
  
  const t = (1 + Math.sqrt(5)) / 2;
  const verts = [
    [-1, t, 0], [1, t, 0], [-1, -t, 0], [1, -t, 0],
    [0, -1, t], [0, 1, t], [0, -1, -t], [0, 1, -t],

  ];
  
  const faces = [

    const ux = br[0] - ar[0];

    const vx = cr[0] - ar[0];
    const vy = cr[1] - ar[1];

    let nx = uy * vz - uz * vy;
    let ny = uz * vx - ux * vz;
    let nz = ux * vy - uy * vx;
    
    const len = Math.hypot(nx, ny, nz) || 1;

    const idx = positions.length / 3;

  }
  
  return createMesh(positions, normals, indices, colors);

function generateSapling() {
  const positions = [];
  const normals = [];
  const colors = [];
  const indices = [];
  
  const trunkColor = [0.4, 0.25, 0.15];
  const leafColor = [0.2, 0.5, 0.2];
  const trunkR = 0.03;
  const trunkH = 0.3;
  const segs = 4;
  
  for (let y = 0; y <= 1; y++) {
    for (let s = 0; s <= segs; s++) {
      const a = (s / segs) * Math.PI * 2;
      positions.push(Math.cos(a) * trunkR, y * trunkH, Math.sin(a) * trunkR);
      normals.push(Math.cos(a), 0, Math.sin(a));
      colors.push(trunkColor[0], trunkColor[1], trunkColor[2]);
    }
  }
  
  for (let s = 0; s < segs; s++) {
    const i = s;
    indices.push(i, i + segs + 1, i + 1);
    indices.push(i + 1, i + segs + 1, i + segs + 2);
  }
  
  const off = positions.length / 3;
  const leafR = 0.2;
  const leafH = 0.4;
  const leafSegs = 6;
  
  const sl = Math.atan2(leafR, leafH);
  const ny = Math.cos(sl);
  const nr = Math.sin(sl);
  
  for (let s = 0; s <= leafSegs; s++) {
    const a = (s / leafSegs) * Math.PI * 2;
    positions.push(Math.cos(a) * leafR, trunkH, Math.sin(a) * leafR);
    normals.push(Math.cos(a) * nr, ny, Math.sin(a) * nr);
    colors.push(leafColor[0], leafColor[1], leafColor[2]);
  }
  
  const apex = positions.length / 3;
  positions.push(0, trunkH + leafH, 0);
  normals.push(0, 1, 0);
  colors.push(leafColor[0], leafColor[1], leafColor[2]);
  
  for (let s = 0; s < leafSegs; s++) {
    indices.push(off + s, apex, off + s + 1);
  }
  
  return createMesh(positions, normals, indices, colors);
}
