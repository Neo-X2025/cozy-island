function initGame() {
  let sx = 0;
  let sz = 22;
  let sh = heightAt(sx, sz);
  
  while (sh < 0.6 && sz > 4) {
    sz -= 1;
    sh = heightAt(sx, sz);
  }

  game = {
    player: { 
      pos: [sx, sh, sz], 
      rot: 0, 
      walkPhase: 0, 
      bobAmt: 0, 
      hitCooldown: 0 
    },
    camera: { 
      yaw: 0, 
      pitch: 0.0, 
      pos: [0, 0, 0] 
    },
    trees: [],
    rocks: [],
    drops: [],
    particles: createParticlePool(),
    wood: 0,
    stone: 0,
    saplings: 0,
    time: 0,
    timeOfDay: 75,
    upgradeLevel: 0,
    playerHitCd: 0.4,
    playerSpeed: 5.5,
    rockRespawnTimer: 0,
    gameOver: false,
    isHoldingAction: false,
    environment: { 
      lightDir: [-0.5, -0.85, -0.3], 
      fogColor: [0.62, 0.80, 0.90], 
      ambientColor: [0.45, 0.45, 0.45], 
      lightColor: [1.0, 0.9, 0.8], 
      sunDir: [0, 1, 0], 
      moonDir: [0, -1, 0], 
      topColor: [0.1, 0.3, 0.7], 
      botColor: [0.5, 0.7, 0.9], 
      starVisibility: 0 
    },
    near: null,
    joy: { 
      active: false, 
      dx: 0, 
      dy: 0, 
      id: null, 
      cx: 0, 
      cy: 0, 
      maxR: 50 
    },
    look: { 
      active: false, 
      id: null, 
      lastX: 0, 
      lastY: 0 
    },
    keys: {},
  };

  for (let i = 0; i < 15; i++) {
    let x;
    let z;
    let h;
    let tries = 0;
    
    do {
      const r = Math.sqrt(Math.random()) * (ISLAND_RADIUS - 5);
      const a = Math.random() * Math.PI * 2;
      x = Math.cos(a) * r;
      z = Math.sin(a) * r;
      h = heightAt(x, z);
      tries++;
    } while ((h < 1.0 || Math.hypot(x - sx, z - sz) < 3.0) && tries < 30);
    
    if (h < 1.0) {
      continue;
    }
    
    const scale = 0.85 + Math.random() * 0.45;
    
    game.trees.push({
      pos: [x, h, z], 
      rot: Math.random() * Math.PI * 2, 
      targetScale: scale, 
      currentScale: scale,
      hp: 10, 
      maxHp: 10, 
      shake: 0, 
      isGrown: true
    });
  }
  
  for (let i = 0; i < 44; i++) {
    let x;
    let z;
    let h;
    let tries = 0;
    
    do {
      const r = Math.sqrt(Math.random()) * (ISLAND_RADIUS - 1);
      const a = Math.random() * Math.PI * 2;
      x = Math.cos(a) * r;
      z = Math.sin(a) * r;
      h = heightAt(x, z);
      tries++;
    } while ((h < -0.1 || Math.hypot(x - sx, z - sz) < 3.0) && tries < 30);
    
    if (h < -0.1) {
      continue;
    }
    
    game.rocks.push({
      pos: [x, h, z], 
      rot: Math.random() * Math.PI * 2, 
      scale: 0.45 + Math.random() * 0.55,
      hp: 5, 
      maxHp: 5, 
      shake: 0
    });
  }
}

function setupInput() {
  const loginScreen = document.getElementById('login-screen');
  const loginInput = document.getElementById('login-input');
  const loginBtn = document.getElementById('login-btn');
  const moveZone = document.getElementById('move-zone');
  const lookArea = document.getElementById('look-area');
  const actionBtn = document.getElementById('action-btn');
  const plantBtn = document.getElementById('plant-btn');
  const upgradeBtn = document.getElementById('upgrade-btn');
  const joystick = document.getElementById('joystick');
  const joyStick = document.getElementById('joy-stick');
  let ignorePlantClick = false;
  let ignoreUpgradeClick = false;

  loginBtn.addEventListener('click', async () => {
    if (loginBtn.disabled) {
      return;
    }

    AudioManager.init();
    const password = loginInput.value;
    loginInput.value = '';
    loginInput.style.border = '';
    loginBtn.disabled = true;
    loginInput.disabled = true;

    try {
      decryptedLetter = await decryptLetterPayload(password);
      unlocked = true;
      loginScreen.style.display = 'none';
    } catch (error) {
      decryptedLetter = null;
      unlocked = false;
      loginInput.style.border = '2px solid #e74c3c';
    } finally {
      loginBtn.disabled = false;
      loginInput.disabled = false;
      if (!unlocked) {
        loginInput.focus();
      }
    }
  });

  loginInput.addEventListener('keydown', event => {
    if (event.key === 'Enter') {
      loginBtn.click();
    }
  });

  document.getElementById('win-continue-btn').addEventListener('click', () => {
    const winScreen = document.getElementById('win-screen');
    if (!game.gameOver || !winScreen.classList.contains('show') || !decryptedLetter) {
      return;
    }

    winScreen.style.display = 'none';

    document.getElementById('letter-title').textContent = decryptedLetter.title;
    document.getElementById('letter-body').textContent = decryptedLetter.body;
    
    document.getElementById('letter-screen').classList.add('show');
  });

  function joyStart() {
    const rect = joystick.getBoundingClientRect();
    game.joy.active = true;
    game.joy.cx = rect.left + rect.width / 2;
    game.joy.cy = rect.top + rect.height / 2;
    game.joy.maxR = rect.width * 0.42;
  }

  function joyMove(clientX, clientY) {
    let dx = clientX - game.joy.cx;
    let dy = clientY - game.joy.cy;
    const len = Math.hypot(dx, dy);
    const max = game.joy.maxR;
    
    if (len > max) {
      dx = dx / len * max;
      dy = dy / len * max;
    }
    
    game.joy.dx = dx / max;
    game.joy.dy = dy / max;
    joyStick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  }

  function joyEnd() {
    game.joy.active = false;
    game.joy.dx = 0;
    game.joy.dy = 0;
    joyStick.style.transform = 'translate(-50%, -50%)';
  }

  function lookMove(clientX, clientY) {
    const dx = clientX - game.look.lastX;
    const dy = clientY - game.look.lastY;
    game.camera.yaw -= dx * 0.005;
    game.camera.pitch = Math.max(-1.4, Math.min(1.4, game.camera.pitch - dy * 0.005));
    game.look.lastX = clientX;
    game.look.lastY = clientY;
  }

  moveZone.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (game.joy.active) {
      return;
    }
    const t = e.changedTouches[0];
    game.joy.id = t.identifier;
    joyStart();
    joyMove(t.clientX, t.clientY);
  }, { passive: false });

  lookArea.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (game.look.active) {
      return;
    }
    const t = e.changedTouches[0];
    game.look.active = true;
    game.look.id = t.identifier;
    game.look.lastX = t.clientX;
    game.look.lastY = t.clientY;
  }, { passive: false });

  window.addEventListener('touchmove', (e) => {
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier === game.joy.id) {
        e.preventDefault();
        joyMove(t.clientX, t.clientY);
      } else if (t.identifier === game.look.id) {
        e.preventDefault();
        lookMove(t.clientX, t.clientY);
      }
    }
  }, { passive: false });

  function touchEnd(e) {
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier === game.joy.id) {
        game.joy.id = null;
        joyEnd();
      }
      if (t.identifier === game.look.id) {
        game.look.active = false;
        game.look.id = null;
      }
    }
  }

  window.addEventListener('touchend', touchEnd, { passive: false });
  window.addEventListener('touchcancel', touchEnd, { passive: false });

  moveZone.addEventListener('mousedown', (e) => {
    e.preventDefault();
    game.joy.id = 'mouse';
    joyStart();
    joyMove(e.clientX, e.clientY);
  });

  let mouseLook = false;

  lookArea.addEventListener('mousedown', (e) => {
    e.preventDefault();
    mouseLook = true;
    game.look.lastX = e.clientX;
    game.look.lastY = e.clientY;
  });

  window.addEventListener('mousemove', (e) => {
    if (game.joy.id === 'mouse') {
      joyMove(e.clientX, e.clientY);
    }
    if (mouseLook) {
      lookMove(e.clientX, e.clientY);
    }
  });

  window.addEventListener('mouseup', () => {
    if (game.joy.id === 'mouse') {
      game.joy.id = null;
      joyEnd();
    }
    mouseLook = false;
    game.isHoldingAction = false;
  });

  actionBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    game.isHoldingAction = true;
    const t = e.changedTouches[0];
    if (!game.look.active) {
      game.look.active = true;
      game.look.id = t.identifier;
      game.look.lastX = t.clientX;
      game.look.lastY = t.clientY;
    }
  }, { passive: false });

  actionBtn.addEventListener('touchend', (e) => {
    e.preventDefault();
    game.isHoldingAction = false;
  }, { passive: false });

  actionBtn.addEventListener('touchcancel', () => {
    game.isHoldingAction = false;
  }, { passive: false });

  actionBtn.addEventListener('mousedown', (e) => {
    e.preventDefault();
    game.isHoldingAction = true;
    if (!mouseLook) {
      mouseLook = true;
      game.look.lastX = e.clientX;
      game.look.lastY = e.clientY;
    }
  });

  plantBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    ignorePlantClick = true;
    plantSapling();
  }, { passive: false });

  plantBtn.addEventListener('click', () => {
    if (ignorePlantClick) {
      ignorePlantClick = false;
      return;
    }
    plantSapling();
  });

  upgradeBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    ignoreUpgradeClick = true;
    tryUpgrade();
  }, { passive: false });

  upgradeBtn.addEventListener('click', () => {
    if (ignoreUpgradeClick) {
      ignoreUpgradeClick = false;
      return;
    }
    tryUpgrade();
  });

  document.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    game.keys[k] = true;
    if (k === 'e') {
      game.isHoldingAction = true;
    }
    if (k === 'q') {
      plantSapling();
    }
    if (k === 'r') {
      tryUpgrade();
    }
  });

  document.addEventListener('keyup', (e) => { 
    const k = e.key.toLowerCase();
    game.keys[k] = false; 
    if (k === 'e') {
      game.isHoldingAction = false;
    }
  });

  function resetAllInput() {
    if (game.joy.id !== null) {
      game.joy.id = null;
      joyEnd();
    }
    game.look.active = false;
    game.look.id = null;
    mouseLook = false;
    game.keys = {};
    game.isHoldingAction = false;
  }

  window.addEventListener('blur', resetAllInput);
  window.addEventListener('blur', AudioManager.pause);
  window.addEventListener('focus', AudioManager.resume);
  document.addEventListener('pointerdown', AudioManager.resume, { passive: true });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      resetAllInput();
      AudioManager.pause();
    } else {
      AudioManager.resume();
    }
  });

  canvas.addEventListener('contextmenu', (e) => {
    e.preventDefault();
  });
}

function plantSapling() {
  if (game.saplings <= 0) {
    return;
  }

  const px = game.player.pos[0] - Math.sin(game.camera.yaw) * 1.5;
  const pz = game.player.pos[2] - Math.cos(game.camera.yaw) * 1.5;
  const py = heightAt(px, pz);

  AudioManager.play('plant', { volume: 0.46, pan: 0.08 });
  game.saplings--;
  updateUI();

  const targetScale = 0.85 + Math.random() * 0.45;
  game.trees.push({
    pos: [px, py, pz],
    rot: Math.random() * Math.PI * 2,
    targetScale: targetScale,
    currentScale: 0.1,
    hp: 10,
    maxHp: 10,
    shake: 0,
    isGrown: false,
    growthTimer: 0,
    growthDuration: 60
  });
}

function startHit() {
  if (game.player.hitCooldown > 0) {
    return;
  }
  if (!game.near) {
    return;
  }
  
  game.player.hitCooldown = game.playerHitCd;
  
  const targetType = game.near.type;
  const target = game.near.obj;
  const cameraYawCos = Math.cos(game.camera.yaw);
  const cameraYawSin = Math.sin(game.camera.yaw);
  const rightDistance = (target.pos[0] - game.player.pos[0]) * cameraYawCos
    - (target.pos[2] - game.player.pos[2]) * cameraYawSin;
  const targetPan = Math.max(-0.35, Math.min(0.35, rightDistance * 0.12));
  const willBreak = target.hp <= 1;
  if (!willBreak) {
    AudioManager.play(targetType === 'tree' ? 'chop-wood' : 'mine-stone', {
      volume: targetType === 'tree' ? 0.64 : 0.5,
      pan: targetPan,
      rate: 0.96 + Math.random() * 0.08
    });
  }
  target.hp--;
  target.shake = 1.0;
  
  const hitY = target.pos[1] + (game.near.type === 'tree' ? 1.0 : 0.4) * (target.targetScale || target.scale);
  spawnParticles(target.pos[0], hitY, target.pos[2], game.near.type);
  
  if (target.hp <= 0) {
    destroyObject(game.near);
    AudioManager.play(targetType === 'tree' ? 'break-wood' : 'break-stone', {
      volume: targetType === 'tree' ? 0.62 : 0.52,
      pan: targetPan,
      rate: 0.98 + Math.random() * 0.04
    });
    game.near = null;
    updateActionUI();
  }
}

function spawnParticles(x, y, z, type) {
  const count = type === 'tree' ? 15 : 12;
  const size = type === 'tree' ? 3 + Math.random() * 2 : 1.5 + Math.random() * 1.5;
  const vy_mult = type === 'tree' ? 5 : 3;
  const particles = game.particles;
  
  for (let i = 0; i < count; i++) {
    const slot = nextParticleSlot;
    nextParticleSlot = (nextParticleSlot + 1) % MAX_PARTICLES;
    const offset = slot * PARTICLE_STATE_COMPONENTS;

    if (particleActivePositions[slot] < 0) {
      particleActivePositions[slot] = activeParticleCount;
      activeParticleSlots[activeParticleCount++] = slot;
    }
    particles[offset + PARTICLE_X] = x;
    particles[offset + PARTICLE_Y] = y;
    particles[offset + PARTICLE_Z] = z;
    particles[offset + PARTICLE_VX] = (Math.random() - 0.5) * 4;
    particles[offset + PARTICLE_VY] = Math.random() * vy_mult + 2;
    particles[offset + PARTICLE_VZ] = (Math.random() - 0.5) * 4;
    particles[offset + PARTICLE_LIFE] = 1.0;
    particles[offset + PARTICLE_SIZE] = size;

    if (type === 'tree' && Math.random() < 0.5) {
      particles[offset + PARTICLE_R] = 0.4;
      particles[offset + PARTICLE_G] = 0.6;
      particles[offset + PARTICLE_B] = 0.2;
    } else if (type === 'tree') {
      particles[offset + PARTICLE_R] = 0.5;
      particles[offset + PARTICLE_G] = 0.35;
      particles[offset + PARTICLE_B] = 0.15;
    } else {
      particles[offset + PARTICLE_R] = 0.6;
      particles[offset + PARTICLE_G] = 0.6;
      particles[offset + PARTICLE_B] = 0.6;
    }
  }
}

function tryUpgrade() {
  if (game.gameOver || game.upgradeLevel >= UPGRADE_PATH.length) {
    return;
  }
  
  const upg = UPGRADE_PATH[game.upgradeLevel];
  const c = upg.cost;
  
  if (game.wood < (c.wood || 0)) return;
  if (game.stone < (c.stone || 0)) return;
  if (game.saplings < (c.saplings || 0)) return;
  
  game.wood -= (c.wood || 0);
  game.stone -= (c.stone || 0);
  game.saplings -= (c.saplings || 0);
  
  game.upgradeLevel++;
  AudioManager.play('upgrade', { volume: 0.62 });
  
  if (game.upgradeLevel === 1) game.playerHitCd = 0.4 / 1.5;
  if (game.upgradeLevel === 2) game.playerHitCd = 0.4 / (1.5 * 1.7);
  if (game.upgradeLevel === 3) game.playerHitCd = 0.4 / (1.5 * 1.7 * 1.9);
  if (game.upgradeLevel === 4) {
    showWinScreen();
  }
  
  updateUI();
}

function showWinScreen() {
  game.gameOver = true;
  writeStoredFlag(WIN_STORAGE_KEY);
  document.getElementById('win-screen').classList.add('show');
}

function destroyObject(target) {
  const isTree = target.type === 'tree';
  const collection = isTree ? game.trees : game.rocks;
  const objectIndex = collection.indexOf(target.obj);
  if (objectIndex >= 0) {
    collection.splice(objectIndex, 1);
  }
  let drops;
  
  if (isTree) {
    drops = 6 + Math.floor(Math.random() * 3);
  } else {
    drops = 4 + Math.floor(Math.random() * 3);
  }
  
  let dropY;
  if (isTree) {
    dropY = target.obj.pos[1] + 3.5 * target.obj.targetScale;
  } else {
    dropY = target.obj.pos[1] + 1.0 * target.obj.scale;
  }
  
  let dropType;
  if (isTree) {
    dropType = 'wood';
  } else {
    dropType = 'stone';
  }

  for (let i = 0; i < drops; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 0.3 + Math.random() * 0.8;
    const cosAngle = Math.cos(angle);
    const sinAngle = Math.sin(angle);
    game.drops.push({
      type: dropType, 
      x: target.obj.pos[0] + cosAngle * dist, 
      y: dropY, 
      z: target.obj.pos[2] + sinAngle * dist,
      vx: cosAngle * (0.5 + Math.random()), 
      vy: 1.5 + Math.random() * 1.5, 
      vz: sinAngle * (0.5 + Math.random()),
      rot: Math.random() * Math.PI * 2, 
      spin: (Math.random() - 0.5) * 4, 
      bob: 0, 
      landed: false
    });
  }

  if (isTree) {
    const sDrops = 1 + Math.floor(Math.random() * 2);
    for (let i = 0; i < sDrops; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = 0.3 + Math.random() * 0.8;
      const cosAngle = Math.cos(angle);
      const sinAngle = Math.sin(angle);
      game.drops.push({
        type: 'sapling', 
        x: target.obj.pos[0] + cosAngle * dist, 
        y: dropY, 
        z: target.obj.pos[2] + sinAngle * dist,
        vx: cosAngle * (0.5 + Math.random()), 
        vy: 1.5 + Math.random() * 1.5, 
        vz: sinAngle * (0.5 + Math.random()),
        rot: 0, 
        spin: (Math.random() - 0.5) * 4, 
        bob: 0, 
        landed: false
      });
    }
  }
}

function updateUI() {
  document.getElementById('wood-count').textContent = game.wood;
  document.getElementById('stone-count').textContent = game.stone;
  document.getElementById('sapling-count').textContent = game.saplings;
  
  const plantBtn = document.getElementById('plant-btn');
  if (game.saplings > 0) {
    plantBtn.classList.add('show');
  } else {
    plantBtn.classList.remove('show');
  }
  
  const upgradeBtn = document.getElementById('upgrade-btn');
  const goalTitle = document.getElementById('goal-title');
  const goalCost = document.getElementById('goal-cost');
  
  if (game.gameOver || game.upgradeLevel >= UPGRADE_PATH.length) {
    upgradeBtn.classList.remove('show');
    goalTitle.textContent = "Статус: выживший";
    goalCost.textContent = "Вы спаслись с острова!";
  } else {
    const upg = UPGRADE_PATH[game.upgradeLevel];
    const c = upg.cost;
    const costStr = [];
    
    if (c.wood) {
      costStr.push(`${c.wood} дерева`);
    }
    if (c.stone) {
      costStr.push(`${c.stone} камня`);
    }
    if (c.saplings) {
      costStr.push(`${c.saplings} саженцев`);
    }
    
    goalTitle.textContent = `Цель: ${upg.name} — ${upg.desc}`;
    goalCost.textContent = `Стоимость: ${costStr.join(', ')}`;
    
    let canAfford = true;
    if (game.wood < (c.wood || 0)) {
      canAfford = false;
    }
    if (game.stone < (c.stone || 0)) {
      canAfford = false;
    }
    if (game.saplings < (c.saplings || 0)) {
      canAfford = false;
    }
    
    if (canAfford) {
      upgradeBtn.classList.add('show');
    } else {
      upgradeBtn.classList.remove('show');
    }
  }
}

function updateActionUI() {
  const btn = document.getElementById('action-btn');
  const sub = document.getElementById('action-sub');
  
  if (game.near) {
    btn.classList.add('show');
    if (game.near.type === 'tree') {
      btn.classList.remove('mine');
      btn.classList.add('chop');
      sub.textContent = 'Рубить дерево';
    } else {
      btn.classList.remove('chop');
      btn.classList.add('mine');
      sub.textContent = 'Добывать камень';
    }
  } else {
    btn.classList.remove('show');
  }
}

const DAY_TOP_COLOR = [0.1, 0.3, 0.7];
const DAY_BOTTOM_COLOR = [0.5, 0.7, 0.9];
const NIGHT_TOP_COLOR = [0.01, 0.01, 0.03];
const NIGHT_BOTTOM_COLOR = [0.02, 0.02, 0.05];
const SUNSET_TOP_COLOR = [0.2, 0.1, 0.3];
const SUNSET_BOTTOM_COLOR = [0.9, 0.4, 0.1];
const NIGHT_AMBIENT_COLOR = [0.1, 0.1, 0.15];
const DAY_AMBIENT_COLOR = [0.45, 0.45, 0.45];
const MOON_LIGHT_COLOR = [0.3, 0.3, 0.4];
const SUN_LIGHT_COLOR = [1.0, 0.9, 0.8];
const SUNSET_LIGHT_COLOR = [1.0, 0.5, 0.2];

function mixColor(out, from, to, amount) {
  out[0] = from[0] + (to[0] - from[0]) * amount;
  out[1] = from[1] + (to[1] - from[1]) * amount;
  out[2] = from[2] + (to[2] - from[2]) * amount;
}

function blendColor(out, color, amount) {
  out[0] += (color[0] - out[0]) * amount;
  out[1] += (color[1] - out[1]) * amount;
  out[2] += (color[2] - out[2]) * amount;
}

function updateDayNightCycle(dt) {
  game.timeOfDay += dt;
  if (game.timeOfDay >= 300) {
    game.timeOfDay -= 300;
  }
  
  const t = game.timeOfDay / 300;
  const angle = t * Math.PI * 2;
  const sunHeight = Math.sin(angle);
  const sunX = Math.cos(angle);
  
  const dayAmt = Math.max(0, sunHeight);
  const nightAmt = Math.max(0, -sunHeight);
  const horizonGlow = Math.max(0, 1 - Math.abs(sunHeight) * 3.0);

  const environment = game.environment;
  environment.sunDir[0] = sunX;
  environment.sunDir[1] = sunHeight;
  environment.sunDir[2] = 0.3;
  environment.moonDir[0] = -sunX;
  environment.moonDir[1] = -sunHeight;
  environment.moonDir[2] = 0.3;

  const lightLength = Math.hypot(sunX, sunHeight, 0.3);
  environment.lightDir[0] = -sunX / lightLength;
  environment.lightDir[1] = -sunHeight / lightLength;
  environment.lightDir[2] = -0.3 / lightLength;

  mixColor(environment.topColor, NIGHT_TOP_COLOR, DAY_TOP_COLOR, dayAmt);
  blendColor(environment.topColor, SUNSET_TOP_COLOR, horizonGlow * 0.5);
  mixColor(environment.botColor, NIGHT_BOTTOM_COLOR, DAY_BOTTOM_COLOR, dayAmt);
  blendColor(environment.botColor, SUNSET_BOTTOM_COLOR, horizonGlow * 0.8);
  mixColor(environment.fogColor, NIGHT_BOTTOM_COLOR, DAY_BOTTOM_COLOR, dayAmt);
  blendColor(environment.fogColor, SUNSET_BOTTOM_COLOR, horizonGlow * 0.6);
  mixColor(environment.ambientColor, NIGHT_AMBIENT_COLOR, DAY_AMBIENT_COLOR, dayAmt);
  mixColor(environment.lightColor, MOON_LIGHT_COLOR, SUN_LIGHT_COLOR, dayAmt);
  blendColor(environment.lightColor, SUNSET_LIGHT_COLOR, horizonGlow * 0.7);

  environment.starVisibility = nightAmt;
  environment.isNight = sunHeight < -0.1;
}

function update(dt) {
  if (game.gameOver) {
    return;
  }
  
  game.time += dt;
  updateDayNightCycle(dt);

  game.rockRespawnTimer += dt;
  if (game.rockRespawnTimer >= 2.0) {
    game.rockRespawnTimer = 0;
    const activeRocks = game.rocks.length;
    
    if (activeRocks < 44) {
      let x;
      let z;
      let h;
      let tries = 0;
      
      do {
        const r = Math.sqrt(Math.random()) * (ISLAND_RADIUS - 1);
        const a = Math.random() * Math.PI * 2;
        x = Math.cos(a) * r;
        z = Math.sin(a) * r;
        h = heightAt(x, z);
        tries++;
      } while ((h < -0.1 || Math.hypot(x - game.player.pos[0], z - game.player.pos[2]) < 15.0) && tries < 30);
      
      if (h >= -0.1) {
        game.rocks.push({
          pos: [x, h, z], 
          rot: Math.random() * Math.PI * 2, 
          scale: 0.45 + Math.random() * 0.55,
          hp: 5, 
          maxHp: 5, 
          shake: 0
        });
      }
    }
  }

  if (game.player.hitCooldown > 0) {
    game.player.hitCooldown -= dt;
  } else if (game.isHoldingAction && game.near) {
    startHit();
  }

  for (let i = 0; i < game.trees.length; i++) {
    const t = game.trees[i];
    if (t.shake > 0) {
      t.shake = Math.max(0, t.shake - dt * 5);
    }
    if (!t.isGrown) {
      t.growthTimer += dt;
      const p = Math.min(1, t.growthTimer / t.growthDuration);
      const easedP = 1 - Math.pow(1 - p, 3);
      t.currentScale = 0.1 + easedP * (t.targetScale - 0.1);
      if (p >= 1) {
        t.isGrown = true;
      }
    }
  }

  let mx = 0;
  let mz = 0;
  
  if (game.joy.active) {
    mx = game.joy.dx;
    mz = -game.joy.dy;
  }
  
  if (game.keys['w']) {
    mz += 1;
  }
  if (game.keys['s']) {
    mz -= 1;
  }
  if (game.keys['a']) {
    mx -= 1;
  }
  if (game.keys['d']) {
    mx += 1;
  }
  
  const mag = Math.hypot(mx, mz);
  if (mag > 1) {
    mx /= mag;
    mz /= mag;
  }

  const cy = Math.cos(game.camera.yaw);
  const sy = Math.sin(game.camera.yaw);
  const moveX = -sy * mz + cy * mx;
  const moveZ = -cy * mz - sy * mx;
  const moveMag = mag > 1 ? 1 : mag;

  const speed = game.playerSpeed;
  
  let nx = game.player.pos[0];
  let nz = game.player.pos[2];
  const oldX = nx, oldZ = nz;

  if (moveMag > 0.01) {
    nx += moveX * speed * dt;
    nz += moveZ * speed * dt;
  }

  const playerR = 0.4;
  const treeR = 0.9;
  const rockR = 1.2;

  for (let i = 0; i < game.trees.length; i++) {
    const t = game.trees[i];
    const dx = nx - t.pos[0];
    const dz = nz - t.pos[2];
    const minDist = playerR + treeR * t.currentScale;
    const distanceSquared = dx * dx + dz * dz;
    
    if (distanceSquared < minDist * minDist && distanceSquared > 0.00000001) {
      const dist = Math.sqrt(distanceSquared);
      nx = t.pos[0] + (dx / dist) * minDist;
      nz = t.pos[2] + (dz / dist) * minDist;
    }
  }
  
  for (let i = 0; i < game.rocks.length; i++) {
    const r = game.rocks[i];
    if (r.shake > 0) {
      r.shake = Math.max(0, r.shake - dt * 5);
    }
    const dx = nx - r.pos[0];
    const dz = nz - r.pos[2];
    const minDist = playerR + rockR * r.scale;
    const distanceSquared = dx * dx + dz * dz;
    
    if (distanceSquared < minDist * minDist && distanceSquared > 0.00000001) {
      const dist = Math.sqrt(distanceSquared);
      nx = r.pos[0] + (dx / dist) * minDist;
      nz = r.pos[2] + (dz / dist) * minDist;
    }
  }

  const nH = heightAt(nx, nz);
  let groundH;
  if (nH > -0.3) {
    game.player.pos[0] = nx;
    game.player.pos[2] = nz;
    groundH = nH;
  } else {
    groundH = heightAt(game.player.pos[0], game.player.pos[2]);
  }

  game.player.pos[1] = Math.max(groundH, -0.2);

  const distanceMoved = Math.min(Math.hypot(game.player.pos[0] - oldX, game.player.pos[2] - oldZ), speed * dt);
  if (moveMag > 0.01 && distanceMoved > dt * 0.15) {
    const previousStep = Math.floor(game.player.walkPhase / Math.PI);
    game.player.walkPhase += distanceMoved * 9 / speed;
    const step = Math.floor(game.player.walkPhase / Math.PI);
    if (step > previousStep) {
      AudioManager.play(groundH < 0.54 ? 'step-sand' : 'step-grass', {
        volume: 0.34 + 0.08 * Math.min(distanceMoved / (speed * dt), 1),
        pan: step % 2 ? -0.1 : 0.1,
        rate: 0.98 + Math.random() * 0.04
      });
    }
    game.player.bobAmt = Math.min(1, game.player.bobAmt + dt * 5);
  } else {
    game.player.bobAmt = Math.max(0, game.player.bobAmt - dt * 5);
  }

  game.camera.pos[0] = game.player.pos[0];
  game.camera.pos[1] = game.player.pos[1] + 1.6;
  game.camera.pos[2] = game.player.pos[2];
  
  if (game.player.bobAmt > 0.01) {
    const bob = Math.sin(game.player.walkPhase) * 0.05 * game.player.bobAmt;
    game.camera.pos[1] += Math.abs(bob);
  }

  let bestTargetObject = null;
  let bestTargetType = null;
  let bestScore = 0;
  const maxDistSquared = 3.5 * 3.5;
  const camFx = -sy;
  const camFz = -cy;

  for (let i = 0; i < game.trees.length; i++) {
    const t = game.trees[i];
    if (!t.isGrown) {
      continue;
    }
    const dx = t.pos[0] - game.player.pos[0];
    const dz = t.pos[2] - game.player.pos[2];
    const distanceSquared = dx * dx + dz * dz;
    
    if (distanceSquared < maxDistSquared && distanceSquared > 0.01) {
      const dist = Math.sqrt(distanceSquared);
      const dot = (dx * camFx + dz * camFz) / dist;
      if (dot > 0.3) {
        const score = dot / (dist + 0.5);
        if (score > bestScore) {
          bestScore = score;
          bestTargetObject = t;
          bestTargetType = 'tree';
        }
      }
    }
  }
  
  for (let i = 0; i < game.rocks.length; i++) {
    const r = game.rocks[i];
    const dx = r.pos[0] - game.player.pos[0];
    const dz = r.pos[2] - game.player.pos[2];
    const distanceSquared = dx * dx + dz * dz;
    
    if (distanceSquared < maxDistSquared && distanceSquared > 0.01) {
      const dist = Math.sqrt(distanceSquared);
      const dot = (dx * camFx + dz * camFz) / dist;
      if (dot > 0.3) {
        const score = dot / (dist + 0.5);
        if (score > bestScore) {
          bestScore = score;
          bestTargetObject = r;
          bestTargetType = 'rock';
        }
      }
    }
  }

  const currentTargetObject = game.near ? game.near.obj : null;
  const currentTargetType = game.near ? game.near.type : null;
  if (bestTargetObject !== currentTargetObject || bestTargetType !== currentTargetType) {
    game.near = bestTargetObject ? { type: bestTargetType, obj: bestTargetObject } : null;
    updateActionUI();
  }

  const particles = game.particles;
  let activeIndex = 0;
  while (activeIndex < activeParticleCount) {
    const slot = activeParticleSlots[activeIndex];
    const offset = slot * PARTICLE_STATE_COMPONENTS;
    const life = particles[offset + PARTICLE_LIFE] - dt;
    particles[offset + PARTICLE_LIFE] = life;

    if (life <= 0) {
      deactivateParticleAt(activeIndex);
      continue;
    }

    particles[offset + PARTICLE_X] += particles[offset + PARTICLE_VX] * dt;
    particles[offset + PARTICLE_Y] += particles[offset + PARTICLE_VY] * dt;
    particles[offset + PARTICLE_Z] += particles[offset + PARTICLE_VZ] * dt;
    particles[offset + PARTICLE_VY] -= 15 * dt;

    if (particles[offset + PARTICLE_VY] < 0) {
      const height = heightAt(
        particles[offset + PARTICLE_X],
        particles[offset + PARTICLE_Z]
      ) + 0.1;
      if (particles[offset + PARTICLE_Y] < height) {
        particles[offset + PARTICLE_Y] = height;
        particles[offset + PARTICLE_VY] *= -0.4;
        particles[offset + PARTICLE_VX] *= 0.6;
        particles[offset + PARTICLE_VZ] *= 0.6;
      }
    }
    activeIndex++;
  }

  let resourcesChanged = false;
  for (let i = game.drops.length - 1; i >= 0; i--) {
    const d = game.drops[i];
    
    if (!d.landed) {
      d.vy -= 20 * dt;
      d.x += d.vx * dt;
      d.y += d.vy * dt;
      d.z += d.vz * dt;
      d.rot += d.spin * dt;
      
      const groundY = heightAt(d.x, d.z);
      if (d.y <= groundY + 0.15) {
        d.y = groundY + 0.15;
        d.vy *= -0.3;
        d.vx *= 0.6;
        d.vz *= 0.6;
        d.spin *= 0.5;
        
        if (Math.abs(d.vy) < 1.0 && Math.abs(d.vx) < 0.5 && Math.abs(d.vz) < 0.5) {
          d.landed = true;
          d.vx = 0;
          d.vy = 0;
          d.vz = 0;
          d.spin = 0;
        }
      }
    } else {
      d.bob = Math.sin(game.time * 3 + d.x * 10) * 0.1;
      d.rot += dt * 1.5;
    }
    
    const pickupX = d.x - game.player.pos[0];
    const pickupZ = d.z - game.player.pos[2];
    if (pickupX * pickupX + pickupZ * pickupZ < 2.25 && d.y - game.player.pos[1] < 1.5) {
      AudioManager.play('pickup', {
        volume: 0.28,
        pan: Math.max(-0.35, Math.min(0.35, (d.x - game.player.pos[0]) * 0.12)),
        rate: 0.96 + Math.random() * 0.12
      });
      if (d.type === 'wood') {
        game.wood++;
      } else if (d.type === 'stone') {
        game.stone++;
      } else if (d.type === 'sapling') {
        game.saplings++;
      }
      
      resourcesChanged = true;
      game.drops.splice(i, 1);
    }
  }

  if (resourcesChanged) {
    updateUI();
  }
}

function resize() {
  renderDpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth;
  const h = window.innerHeight;
  canvas.width = Math.floor(w * renderDpr);
  canvas.height = Math.floor(h * renderDpr);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  M4.perspective(projMat, Math.PI / 3, canvas.width / canvas.height, 0.1, 220);
}

function worldToScreen(px, py, pz) {
  const vx = viewMat[0] * px + viewMat[4] * py + viewMat[8] * pz + viewMat[12];
  const vy = viewMat[1] * px + viewMat[5] * py + viewMat[9] * pz + viewMat[13];
  const vz = viewMat[2] * px + viewMat[6] * py + viewMat[10] * pz + viewMat[14];
  const vw = viewMat[3] * px + viewMat[7] * py + viewMat[11] * pz + viewMat[15];
  
  if (vw <= 0) {
    return null;
  }
  
  const cx = projMat[0] * vx + projMat[4] * vy + projMat[8] * vz + projMat[12] * vw;
  const cy = projMat[1] * vx + projMat[5] * vy + projMat[9] * vz + projMat[13] * vw;
  const cw = projMat[3] * vx + projMat[7] * vy + projMat[11] * vz + projMat[15] * vw;
  
  if (cw <= 0) {
    return null;
  }
  
  const ndcx = cx / cw;
  const ndcy = cy / cw;
  
  projectedScreenPosition[0] = (ndcx * 0.5 + 0.5) * window.innerWidth;
  projectedScreenPosition[1] = (1.0 - (ndcy * 0.5 + 0.5)) * window.innerHeight;
  return projectedScreenPosition;
}

function renderShadowPass() {
  if (game.environment.isNight) {
    if (!shadowMapIsCleared) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, shadowFBO);
      gl.viewport(0, 0, SHADOW_MAP_SIZE, SHADOW_MAP_SIZE);
      gl.clearColor(1.0, 1.0, 1.0, 1.0);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      shadowMapIsCleared = true;
    }
    return;
  }

  shadowMapIsCleared = false;

  gl.bindFramebuffer(gl.FRAMEBUFFER, shadowFBO);
  gl.viewport(0, 0, SHADOW_MAP_SIZE, SHADOW_MAP_SIZE);
  gl.clearColor(1.0, 1.0, 1.0, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  
  gl.useProgram(programs.depth.program);
  boundMesh = null;
  boundMeshProgram = null;
  gl.enable(gl.POLYGON_OFFSET_FILL);
  gl.polygonOffset(2.0, 2.0);

  gl.uniformMatrix4fv(programs.depth.uniforms.uLightProjView, false, lightProjViewMat);

  M4.identity(modelMat);
  drawMeshDepth(meshes.terrain, modelMat, programs.depth);
  
  for (let i = 0; i < game.trees.length; i++) {
    const t = game.trees[i];
    M4.identity(modelMat);
    M4.translate(modelMat, modelMat, t.pos);
    M4.rotateY(modelMat, modelMat, t.rot);
    
    const sway = Math.sin(game.time * 1.3 + t.pos[0] * 0.2) * 0.025;
    M4.rotateZ(modelMat, modelMat, sway);
    
    if (t.shake > 0) {
      const s = Math.sin(game.time * 80) * 0.08 * t.shake;
      M4.translateXYZ(modelMat, modelMat, s, 0, s * 0.5);
    }
    
    M4.scaleUniform(modelMat, modelMat, t.currentScale);
    drawMeshDepth(meshes.tree, modelMat, programs.depth);
  }
  
  for (let i = 0; i < game.rocks.length; i++) {
    const r = game.rocks[i];
    M4.identity(modelMat);
    M4.translate(modelMat, modelMat, r.pos);
    M4.rotateY(modelMat, modelMat, r.rot);
    
    if (r.shake > 0) {
      const s = Math.sin(game.time * 80) * 0.05 * r.shake;
      M4.translateXYZ(modelMat, modelMat, s, 0, 0);
    }
    
    M4.scaleUniform(modelMat, modelMat, r.scale);
    drawMeshDepth(meshes.rock, modelMat, programs.depth);
  }
  
  for (let i = 0; i < game.drops.length; i++) {
    const d = game.drops[i];
    M4.identity(modelMat);
    
    let dropY = d.y;
    if (d.landed) {
      dropY += 0.15 + d.bob;
    }
    
    M4.translateXYZ(modelMat, modelMat, d.x, dropY, d.z);
    M4.rotateY(modelMat, modelMat, d.rot);
    
    if (d.type === 'wood') {
      drawMeshDepth(meshes.log, modelMat, programs.depth);
    } else if (d.type === 'stone') {
      drawMeshDepth(meshes.stoneChunk, modelMat, programs.depth);
    } else if (d.type === 'sapling') {
      drawMeshDepth(meshes.sapling, modelMat, programs.depth);
    }
  }

  gl.disable(gl.POLYGON_OFFSET_FILL);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

function renderSky() {
  gl.useProgram(programs.sky.program);
  gl.disable(gl.DEPTH_TEST);
  gl.depthMask(false);
  gl.disable(gl.CULL_FACE);
  
  bindAttrib(programs.sky, 'aPos', meshes.sky.posBuf, 3);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, meshes.sky.idxBuf);
  
  gl.uniformMatrix4fv(programs.sky.uniforms.uProj, false, projMat);
  gl.uniformMatrix4fv(programs.sky.uniforms.uView, false, viewMat);
  
  gl.uniform3fv(programs.sky.uniforms.uSunDir, game.environment.sunDir);
  gl.uniform3fv(programs.sky.uniforms.uMoonDir, game.environment.moonDir);
  gl.uniform3fv(programs.sky.uniforms.uTopColor, game.environment.topColor);
  gl.uniform3fv(programs.sky.uniforms.uBottomColor, game.environment.botColor);
  gl.uniform3fv(programs.sky.uniforms.uSunColor, skySunColor);
  gl.uniform3fv(programs.sky.uniforms.uMoonColor, skyMoonColor);
  gl.uniform1f(programs.sky.uniforms.uTime, game.time);
  gl.uniform1f(programs.sky.uniforms.uStarVisibility, game.environment.starVisibility);
  
  gl.drawElements(gl.TRIANGLES, meshes.sky.count, gl.UNSIGNED_SHORT, 0);
  
  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(true);
  gl.enable(gl.CULL_FACE);
}

function renderMainPass() {
  boundMesh = null;
  boundMeshProgram = null;
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(game.environment.fogColor[0], game.environment.fogColor[1], game.environment.fogColor[2], 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  const cp = Math.cos(game.camera.pitch);
  const sp = Math.sin(game.camera.pitch);
  const cy = Math.cos(game.camera.yaw);
  const sy = Math.sin(game.camera.yaw);

  const fx = -sy * cp;
  const fy = sp;
  const fz = -cy * cp;
  
  viewTarget[0] = game.camera.pos[0] + fx;
  viewTarget[1] = game.camera.pos[1] + fy;
  viewTarget[2] = game.camera.pos[2] + fz;
  
  M4.lookAt(viewMat, game.camera.pos, viewTarget, worldUp);

  renderSky();

  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);

  const lightDir = game.environment.lightDir;
  const fogColor = game.environment.fogColor;
  const ambientColor = game.environment.ambientColor;
  const lightColor = game.environment.lightColor;
  const fogNear = 28;
  const fogFar = 90;

  gl.useProgram(programs.terrain.program);
  bindAttrib(programs.terrain, 'aPos', meshes.terrain.posBuf, 3);
  bindAttrib(programs.terrain, 'aNormal', meshes.terrain.nrmBuf, 3);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, meshes.terrain.idxBuf);
  
  gl.uniformMatrix4fv(programs.terrain.uniforms.uProj, false, projMat);
  gl.uniformMatrix4fv(programs.terrain.uniforms.uView, false, viewMat);
  gl.uniformMatrix4fv(programs.terrain.uniforms.uLightProjView, false, lightProjViewMat);
  
  M4.identity(modelMat);
  gl.uniformMatrix4fv(programs.terrain.uniforms.uModel, false, modelMat);
  gl.uniform3fv(programs.terrain.uniforms.uLightDir, lightDir);
  gl.uniform3fv(programs.terrain.uniforms.uCameraPos, game.camera.pos);
  gl.uniform3fv(programs.terrain.uniforms.uFogColor, fogColor);
  gl.uniform3fv(programs.terrain.uniforms.uAmbientColor, ambientColor);
  gl.uniform3fv(programs.terrain.uniforms.uLightColor, lightColor);
  gl.uniform1f(programs.terrain.uniforms.uFogNear, fogNear);
  gl.uniform1f(programs.terrain.uniforms.uFogFar, fogFar);
  
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, shadowTex);
  gl.uniform1i(programs.terrain.uniforms.uShadowMap, 0);
  gl.drawElements(gl.TRIANGLES, meshes.terrain.count, gl.UNSIGNED_SHORT, 0);

  gl.useProgram(programs.water.program);
  gl.disable(gl.CULL_FACE);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);
  
  bindAttrib(programs.water, 'aPos', meshes.water.posBuf, 3);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, meshes.water.idxBuf);
  
  gl.uniformMatrix4fv(programs.water.uniforms.uProj, false, projMat);
  gl.uniformMatrix4fv(programs.water.uniforms.uView, false, viewMat);
  gl.uniformMatrix4fv(programs.water.uniforms.uLightProjView, false, lightProjViewMat);
  
  M4.identity(modelMat);
  gl.uniformMatrix4fv(programs.water.uniforms.uModel, false, modelMat);
  gl.uniform1f(programs.water.uniforms.uTime, game.time);
  gl.uniform3fv(programs.water.uniforms.uCameraPos, game.camera.pos);
  gl.uniform3fv(programs.water.uniforms.uFogColor, fogColor);
  gl.uniform3fv(programs.water.uniforms.uLightDir, lightDir);
  gl.uniform3fv(programs.water.uniforms.uAmbientColor, ambientColor);
  gl.uniform3fv(programs.water.uniforms.uLightColor, lightColor);
  gl.uniform1f(programs.water.uniforms.uFogNear, fogNear);
  gl.uniform1f(programs.water.uniforms.uFogFar, fogFar);
  gl.uniform1i(programs.water.uniforms.uShadowMap, 0);
  gl.drawElements(gl.TRIANGLES, meshes.water.count, gl.UNSIGNED_SHORT, 0);
  
  gl.depthMask(true);
  gl.disable(gl.BLEND);
  gl.enable(gl.CULL_FACE);

  gl.useProgram(programs.obj.program);
  gl.uniformMatrix4fv(programs.obj.uniforms.uProj, false, projMat);
  gl.uniformMatrix4fv(programs.obj.uniforms.uView, false, viewMat);
  gl.uniformMatrix4fv(programs.obj.uniforms.uLightProjView, false, lightProjViewMat);
  gl.uniform3fv(programs.obj.uniforms.uLightDir, lightDir);
  gl.uniform3fv(programs.obj.uniforms.uCameraPos, game.camera.pos);
  gl.uniform3fv(programs.obj.uniforms.uFogColor, fogColor);
  gl.uniform3fv(programs.obj.uniforms.uAmbientColor, ambientColor);
  gl.uniform3fv(programs.obj.uniforms.uLightColor, lightColor);
  gl.uniform1f(programs.obj.uniforms.uFogNear, fogNear);
  gl.uniform1f(programs.obj.uniforms.uFogFar, fogFar);
  gl.uniform1i(programs.obj.uniforms.uShadowMap, 0);

  for (let i = 0; i < game.trees.length; i++) {
    const t = game.trees[i];
    M4.identity(modelMat);
    M4.translate(modelMat, modelMat, t.pos);
    M4.rotateY(modelMat, modelMat, t.rot);
    
    const sway = Math.sin(game.time * 1.3 + t.pos[0] * 0.2) * 0.025;
    M4.rotateZ(modelMat, modelMat, sway);
    
    if (t.shake > 0) {
      const s = Math.sin(game.time * 80) * 0.08 * t.shake;
      M4.translateXYZ(modelMat, modelMat, s, 0, s * 0.5);
    }
    
    M4.scaleUniform(modelMat, modelMat, t.currentScale);
    drawMesh(meshes.tree, modelMat, programs.obj);
  }
  
  for (let i = 0; i < game.rocks.length; i++) {
    const r = game.rocks[i];
    M4.identity(modelMat);
    M4.translate(modelMat, modelMat, r.pos);
    M4.rotateY(modelMat, modelMat, r.rot);
    
    if (r.shake > 0) {
      const s = Math.sin(game.time * 80) * 0.05 * r.shake;
      M4.translateXYZ(modelMat, modelMat, s, 0, 0);
    }
    
    M4.scaleUniform(modelMat, modelMat, r.scale);
    drawMesh(meshes.rock, modelMat, programs.obj);
  }
  
  for (let i = 0; i < game.drops.length; i++) {
    const d = game.drops[i];
    M4.identity(modelMat);
    
    let dropY = d.y;
    if (d.landed) {
      dropY += 0.15 + d.bob;
    }
    
    M4.translateXYZ(modelMat, modelMat, d.x, dropY, d.z);
    M4.rotateY(modelMat, modelMat, d.rot);
    
    if (d.type === 'wood') {
      drawMesh(meshes.log, modelMat, programs.obj);
    } else if (d.type === 'stone') {
      drawMesh(meshes.stoneChunk, modelMat, programs.obj);
    } else if (d.type === 'sapling') {
      drawMesh(meshes.sapling, modelMat, programs.obj);
    }
  }

  if (activeParticleCount > 0) {
    gl.useProgram(programs.particle.program);
    gl.disable(gl.CULL_FACE);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(false);
    
    const particleData = meshes.particle.data;
    let particleDrawCount = 0;
    
    const particles = game.particles;
    for (let i = 0; i < activeParticleCount; i++) {
      const slot = activeParticleSlots[i];
      const stateOffset = slot * PARTICLE_STATE_COMPONENTS;
      const offset = particleDrawCount * PARTICLE_COMPONENTS;
      particleData[offset] = particles[stateOffset + PARTICLE_X];
      particleData[offset + 1] = particles[stateOffset + PARTICLE_Y];
      particleData[offset + 2] = particles[stateOffset + PARTICLE_Z];
      particleData[offset + 3] = particles[stateOffset + PARTICLE_R];
      particleData[offset + 4] = particles[stateOffset + PARTICLE_G];
      particleData[offset + 5] = particles[stateOffset + PARTICLE_B];
      particleData[offset + 6] = particles[stateOffset + PARTICLE_SIZE]
        * particles[stateOffset + PARTICLE_LIFE]
        * renderDpr;
      particleDrawCount++;
    }

    if (particleDrawCount !== meshes.particle.uploadCount) {
      meshes.particle.uploadCount = particleDrawCount;
      meshes.particle.uploadView = particleData.subarray(
        0,
        particleDrawCount * PARTICLE_COMPONENTS
      );
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, meshes.particle.buf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, meshes.particle.uploadView);
    
    bindAttrib(programs.particle, 'aPos', meshes.particle.buf, 3, 28, 0);
    bindAttrib(programs.particle, 'aColor', meshes.particle.buf, 3, 28, 12);
    bindAttrib(programs.particle, 'aSize', meshes.particle.buf, 1, 28, 24);
    
    gl.uniformMatrix4fv(programs.particle.uniforms.uProj, false, projMat);
    gl.uniformMatrix4fv(programs.particle.uniforms.uView, false, viewMat);
    gl.uniform1f(programs.particle.uniforms.uNight, game.environment.starVisibility);
    gl.drawArrays(gl.POINTS, 0, particleDrawCount);
    
    gl.depthMask(true);
    gl.disable(gl.BLEND);
    gl.enable(gl.CULL_FACE);
  }

  if (game.near && game.near.obj.hp < game.near.obj.maxHp) {
    const obj = game.near.obj;
    const s = obj.targetScale || obj.scale;
    let hpYOffset;
    
    if (game.near.type === 'tree') {
      hpYOffset = 2.8;
    } else {
      hpYOffset = 1.0;
    }
    
    const screenPos = worldToScreen(obj.pos[0], obj.pos[1] + hpYOffset * s, obj.pos[2]);
    
    if (screenPos) {
      hpBarContainer.style.display = 'block';
      hpBarContainer.style.left = (screenPos[0] - 30) + 'px';
      hpBarContainer.style.top = (screenPos[1] - 30) + 'px';
      hpBarFill.style.width = (obj.hp / obj.maxHp * 100) + '%';
    } else {
      hpBarContainer.style.display = 'none';
    }
  } else {
    hpBarContainer.style.display = 'none';
  }
}

function getStabilizedShadowDirection(target) {
  if (!hasStabilizedShadowDirection) {
    stabilizedShadowDirection[0] = target[0];
    stabilizedShadowDirection[1] = target[1];
    stabilizedShadowDirection[2] = target[2];
    hasStabilizedShadowDirection = true;
    return stabilizedShadowDirection;
  }

  const alignment =
    stabilizedShadowDirection[0] * target[0] +
    stabilizedShadowDirection[1] * target[1] +
    stabilizedShadowDirection[2] * target[2];
  const directionThreshold = Math.cos(0.001);

  if (alignment < directionThreshold) {
    stabilizedShadowDirection[0] = target[0];
    stabilizedShadowDirection[1] = target[1];
    stabilizedShadowDirection[2] = target[2];
  }

  return stabilizedShadowDirection;
}

function stabilizeShadowView(view, texelSize) {
  const hysteresis = texelSize * 0.75;

  if (!Number.isFinite(stabilizedShadowX) || !Number.isFinite(stabilizedShadowY)) {
    stabilizedShadowX = Math.round(view[12] / texelSize) * texelSize;
    stabilizedShadowY = Math.round(view[13] / texelSize) * texelSize;
  } else {
    const deltaX = view[12] - stabilizedShadowX;
    const deltaY = view[13] - stabilizedShadowY;

    if (Math.abs(deltaX) > hysteresis) {
      stabilizedShadowX += Math.round(deltaX / texelSize) * texelSize;
    }
    if (Math.abs(deltaY) > hysteresis) {
      stabilizedShadowY += Math.round(deltaY / texelSize) * texelSize;
    }
  }

  view[12] = stabilizedShadowX;
  view[13] = stabilizedShadowY;
}

function render() {
  if (!game.environment.isNight) {
    const lDir = getStabilizedShadowDirection(game.environment.lightDir);
    shadowLightPosition[0] = game.player.pos[0] - lDir[0] * 30;
    shadowLightPosition[1] = game.player.pos[1] - lDir[1] * 30;
    shadowLightPosition[2] = game.player.pos[2] - lDir[2] * 30;
    
    M4.lookAt(lightViewMat, shadowLightPosition, game.player.pos, worldUp);
    stabilizeShadowView(lightViewMat, SHADOW_TEXEL_WORLD_SIZE);
    M4.multiply(lightProjViewMat, lightProjMat, lightViewMat);
  }

  renderShadowPass();
  renderMainPass();
}

function saveGame() {
  if (!game || !unlocked) return;
  try {
    const savedGame = { ...game };
    delete savedGame.particles;
    localStorage.setItem('cozy_save', JSON.stringify({
      ...savedGame,
      near: null,
      keys: {},
      isHoldingAction: false,
      joy: { ...game.joy, active: false, dx: 0, dy: 0, id: null },
      look: { ...game.look, active: false, id: null }
    }));
  } catch (error) {
    console.warn('Сохранение игры недоступно:', error);
  }
}

function restoreGame() {
  try {
    const saved = localStorage.getItem('cozy_save');
    if (!saved) return;
    const parsed = JSON.parse(saved);
    const playerDefaults = game.player;
    const cameraDefaults = game.camera;
    const environmentDefaults = game.environment;
    const joyDefaults = game.joy;
    const lookDefaults = game.look;
    const particlePool = game.particles;
    Object.assign(game, parsed);
    game.trees = game.trees.filter(tree => !tree.harvested);
    game.rocks = game.rocks.filter(rock => !rock.harvested);
    game.player = Object.assign(playerDefaults, parsed.player || {});
    game.camera = Object.assign(cameraDefaults, parsed.camera || {});
    game.environment = Object.assign(environmentDefaults, parsed.environment || {});
    game.joy = Object.assign(joyDefaults, parsed.joy || {});
    game.look = Object.assign(lookDefaults, parsed.look || {});
    game.near = null;
    game.keys = {};
    game.isHoldingAction = false;
    game.joy.active = false;
    game.joy.dx = 0;
    game.joy.dy = 0;
    game.joy.id = null;
    game.look.active = false;
    game.look.id = null;
    game.particles = particlePool;
    resetParticlePool();
  } catch (error) {
    console.warn('Сохранение игры повреждено, начата новая игра:', error);
    try {
      localStorage.removeItem('cozy_save');
    } catch (storageError) {
      console.warn('Не удалось очистить поврежденное сохранение:', storageError);
    }
  }
}

function init() {
  canvas = document.getElementById('gl');
  hpBarContainer = document.getElementById('hp-bar-container');
  hpBarFill = document.getElementById('hp-bar-fill');
  gl = canvas.getContext('webgl', { antialias: true, alpha: false }) || canvas.getContext('experimental-webgl');
  
  if (!gl) {
    document.body.innerHTML = '<div style="color:#fff;padding:40px;text-align:center;font-family:sans-serif">Ваш браузер не поддерживает WebGL.</div>';
    return;
  }
  
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  programs.terrain = createProgram(VS_TERRAIN, FS_TERRAIN);
  programs.water = createProgram(VS_WATER, FS_WATER);
  programs.obj = createProgram(VS_OBJ, FS_OBJ);
  programs.particle = createProgram(VS_PARTICLE, FS_PARTICLE);
  programs.depth = createProgram(VS_DEPTH, FS_DEPTH);
  programs.sky = createProgram(VS_SKY, FS_SKY);

  meshes.terrain = generateTerrain();
  meshes.water = generateWater();
  meshes.sky = generateSkyDome();
  meshes.tree = generateTree();
  meshes.rock = generateRock();
  meshes.log = generateLog();
  meshes.stoneChunk = generateStoneChunk();
  meshes.sapling = generateSapling();
  meshes.particle = {
    buf: gl.createBuffer(),
    data: new Float32Array(MAX_PARTICLES * PARTICLE_COMPONENTS),
    uploadView: new Float32Array(0),
    uploadCount: 0
  };
  gl.bindBuffer(gl.ARRAY_BUFFER, meshes.particle.buf);
  gl.bufferData(gl.ARRAY_BUFFER, meshes.particle.data.byteLength, gl.DYNAMIC_DRAW);

  shadowFBO = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, shadowFBO);
  shadowTex = gl.createTexture();
  
  gl.bindTexture(gl.TEXTURE_2D, shadowTex);
  gl.texImage2D(
    gl.TEXTURE_2D,
    0,
    gl.RGBA,
    SHADOW_MAP_SIZE,
    SHADOW_MAP_SIZE,
    0,
    gl.RGBA,
    gl.UNSIGNED_BYTE,
    null
  );
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, shadowTex, 0);

  const shadowDepth = gl.createRenderbuffer();
  gl.bindRenderbuffer(gl.RENDERBUFFER, shadowDepth);
  gl.renderbufferStorage(
    gl.RENDERBUFFER,
    gl.DEPTH_COMPONENT16,
    SHADOW_MAP_SIZE,
    SHADOW_MAP_SIZE
  );
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, shadowDepth);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);

  initGame();
  restoreGame();
  if (game.gameOver || readStoredFlag(WIN_STORAGE_KEY)) {
    showWinScreen();
  }
  setInterval(saveGame, 5000);
  window.addEventListener('beforeunload', saveGame);
  setupInput();
  updateUI();

  let last = performance.now();
  
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (unlocked) {
      update(dt);
      render();
    }
    requestAnimationFrame(loop);
  }
  
  requestAnimationFrame(loop);
}

window.addEventListener('load', init);
</script>
